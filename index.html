 const nav=state.sim.pool.map((_,i)=>`<button class="${i===state.sim.index?'active':''} ${state.sim.responses[i]!==null?'answered':''} ${state.sim.marked.includes(i)?'marked':''}" data-sim-jump="${i}" title="Questão ${i+1}">${i+1}</button>`).join('');
 return `<section class="diag"><div class="sim-progress"><span class="badge">Questão ${state.sim.index+1}/${state.sim.pool.length}</span><span class="badge" id="sim-timer">⏱ ${fmtTime(remainingTime())}</span><span class="muted">${esc(simDiscipline(c,q))} · ${esc(q.topic)}</span></div><div class="diag-card"><div class="progress" style="margin-bottom:20px"><i style="width:${answered/state.sim.pool.length*100}%"></i></div><h2>${esc(q.statement)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" data-sim-opt="${i}"><b class="letter">${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="lesson-footer"><button class="secondary" id="sim-prev" ${state.sim.index===0?'disabled':''}>← Anterior</button><button class="secondary" id="sim-mark">${marked?'★ Marcada':'☆ Marcar para revisão'}</button><button class="primary" id="sim-next">${state.sim.index===state.sim.pool.length-1?'Revisar grade':'Próxima'} →</button></div><button class="danger" id="sim-finish" style="margin-top:12px">Finalizar simulado</button></div><div class="panel" style="margin-top:16px"><strong>Navegação</strong><p class="muted">Respondidas: ${answered}/${state.sim.pool.length}. Itens podem permanecer em branco.</p><div class="sim-nav-grid">${nav}</div></div></section>`
}
function bindSimulation(){
 clearInterval(simTimerHandle);
 $$('[data-sim-start]').forEach(b=>b.onclick=()=>startSim(b.dataset.simStart));
 $$('[data-sim-opt]').forEach(b=>b.onclick=()=>{state.sim.responses[state.sim.index]=Number(b.dataset.simOpt);render()});
 $$('[data-sim-jump]').forEach(b=>b.onclick=()=>{state.sim.index=Number(b.dataset.simJump);render()});
 $('#sim-prev')?.addEventListener('click',()=>{state.sim.index=Math.max(0,state.sim.index-1);render()});
 $('#sim-next')?.addEventListener('click',()=>{if(state.sim.index<state.sim.pool.length-1)state.sim.index++;else{const firstBlank=state.sim.responses.findIndex(x=>x===null);state.sim.index=firstBlank>=0?firstBlank:0}render()});
 $('#sim-mark')?.addEventListener('click',()=>{const i=state.sim.index,at=state.sim.marked.indexOf(i);if(at>=0)state.sim.marked.splice(at,1);else state.sim.marked.push(i);render()});
 $('#sim-finish')?.addEventListener('click',()=>{const blank=state.sim.responses.filter(x=>x===null).length;if(confirm(blank?`Há ${blank} questões em branco. Finalizar mesmo assim?`:'Finalizar e corrigir o simulado?'))finalizeSim()});
 $('#sim-reset')?.addEventListener('click',()=>{state.sim=null;render()});
 if(state.sim&&!state.sim.done){simTimerHandle=setInterval(()=>{const left=remainingTime(),el=$('#sim-timer');if(el)el.textContent=`⏱ ${fmtTime(left)}`;if(left<=0)finalizeSim()},1000)}
}

function profilePage(){return `<section><div class="page-head"><div><span class="eyebrow">PREFERÊNCIAS</span><h1>Seu perfil</h1><p>O progresso permanece salvo somente neste navegador.</p></div></div><article class="panel settings"><label>Nome<input id="pf-name" value="${esc(state.profile.name)}"></label><label>Meta diária<select id="pf-time">${[20,30,45,60,90].map(v=>`<option value="${v}" ${v===state.profile.dailyMinutes?'selected':''}>${v<60?v+' minutos':v===60?'1 hora':'1h30'}</option>`).join('')}</select></label><div class="toggle"><div><strong>Tema escuro</strong><small class="muted">Reduz luminosidade em ambientes escuros.</small></div><input id="pf-theme" type="checkbox" ${state.profile.theme==='dark'?'checked':''}></div><button class="primary" id="pf-save">Salvar alterações</button><div style="border-top:1px solid var(--line);padding-top:15px"><strong>Apagar demonstração</strong><p class="muted">Remove perfil e todo o progresso local.</p><button class="danger" id="pf-reset">Apagar dados</button></div></article></section>`}
function bindProfile(){$('#pf-save')?.addEventListener('click',()=>{state.profile.name=$('#pf-name').value.trim()||state.profile.name;state.profile.dailyMinutes=Number($('#pf-time').value);state.profile.theme=$('#pf-theme').checked?'dark':'light';saveProfile();render()});$('#pf-reset')?.addEventListener('click',()=>{if(confirm('Apagar todos os dados locais do Versa Concursos?')){storage.clear();location.reload()}})}
function admin(){const c=course(),p=progress(),drafts=read('versa-drafts-v2',[]);return `<section><div class="page-head"><div><span class="eyebrow">PAINEL LOCAL</span><h1>Administração</h1><p>Resumo editorial e rascunhos salvos neste navegador.</p></div><span class="badge">GitHub Pages</span></div><div class="admin-grid"><div><strong>${Object.keys(COURSES).length}</strong><span>Cursos</span></div><div><strong>${Object.values(COURSES).reduce((a,x)=>a+x.lessons.length,0)}</strong><span>Lições</span></div><div><strong>${Object.values(COURSES).reduce((a,x)=>a+x.questions.length,0)}</strong><span>Questões</span></div></div><div class="dashboard-grid" style="margin-top:18px"><article class="panel"><h2>Novo rascunho</h2><input class="draft-input" id="draft" placeholder="Ex.: Aula de Equações Diferenciais"><button class="primary" id="draft-add" style="margin-top:10px">Salvar rascunho</button></article><article class="panel"><h2>Rascunhos</h2>${drafts.length?drafts.map(d=>`<p>• ${esc(d.title)} <small class="muted">(${esc(d.course)})</small></p>`).join(''):'<p class="muted">Nenhum rascunho.</p>'}</article></div><article class="panel" style="margin-top:18px"><h2>Status de ${esc(c.name)}</h2><p>${c.units.length} áreas · ${c.lessons.length} lições · ${c.questions.length} questões · ${p.completed.length} concluídas pelo usuário atual.</p></article></section>`}
function bindAdmin(){$('#draft-add')?.addEventListener('click',()=>{const v=$('#draft').value.trim();if(!v)return;const d=read('versa-drafts-v2',[]);d.push({title:v,course:state.activeCourse,date:new Date().toISOString()});storage.setItem('versa-drafts-v2',JSON.stringify(d));render()})}
render();
})()</script></body></html>

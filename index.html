.","Unknown words may be inferred from context.","Alternatives must be checked against the passage."],"example":"To find a date, product name or percentage, scanning is usually more efficient than translating the whole text.","recall":"Explain the difference between skimming and scanning.","tags":["reading","skimming","scanning"],"q":"Scanning is mainly used to:","correct":"locate specific information quickly","distractors":["translate every word in order","identify only verb tenses","rewrite the complete passage","ignore headings and numbers"],"practice":"Read the question first and highlight the exact evidence in the passage.","difficulty":"Básico","videos":["v-en-reading-search"],"prereq":[]},{"title":"Reference, cognates and contextual vocabulary","objective":"Identificar referentes e inferir significados pelo contexto.","summary":"Pronouns and demonstratives connect sentences; cognates can help, but false cognates and polysemy require contextual checking.","points":["It, they, this and which may refer to previous ideas.","Cognates share form and meaning across languages.","False cognates resemble Portuguese but differ in meaning.","Prefixes and suffixes reveal grammatical role and meaning."],"example":"In “The system was patched. This reduced exposure”, “This” refers to the patching action and its result.","recall":"Give one example of a false cognate.","tags":["reference","cognates","vocabulary"],"q":"In technical reading, the safest way to interpret a familiar-looking word is to:","correct":"confirm its meaning from the surrounding sentence","distractors":["assume it always matches Portuguese","ignore its grammatical function","replace it by any synonym","translate only its first dictionary meaning"],"practice":"Mark the noun or idea to which each pronoun refers.","difficulty":"Intermediário","videos":["v-en-reading-search","v-en-reading-search"],"prereq":["den-001"]},{"title":"Verb tenses and modal verbs","objective":"Interpretar tempo, aspecto, obrigação e possibilidade.","summary":"Verb tenses locate events and show completion or continuity; modal verbs express ability, permission, probability, obligation and recommendation.","points":["Present perfect links past events to the present.","Must often expresses strong obligation or logical deduction.","May and might express possibility.","Should commonly expresses recommendation."],"example":"“The team has contained the incident” emphasizes a completed action with present relevance.","recall":"What is the difference between must and might?","tags":["verb tenses","modals"],"q":"In “Administrators must enable MFA”, must expresses:","correct":"obligation","distractors":["past habit","weak possibility","completed duration","reported speech"],"practice":"Identify the communicative value of the modal instead of translating it in isolation.","difficulty":"Intermediário","videos":["v-en-modals","v-en-present-perfect"],"prereq":["den-002"]},{"title":"Passive voice, conditionals and connectors","objective":"Reconhecer relações gramaticais frequentes em textos técnicos.","summary":"Passive voice emphasizes the action or affected object; conditionals express rules, real possibilities and hypothetical outcomes; connectors organize logic.","points":["Passive voice uses be plus past participle.","Zero conditional states general results.","First conditional describes a realistic future condition.","However contrasts; therefore concludes."],"example":"“If the key is exposed, the certificate will be revoked” is a first conditional about a possible future event.","recall":"Transform “The analyst reviewed the logs” into the passive voice.","tags":["passive voice","conditionals","connectors"],"q":"The passive form of “The SOC detected the attack” is:","correct":"The attack was detected by the SOC.","distractors":["The attack detected the SOC.","The SOC was detecting by the attack.","The attack has detect by the SOC.","The SOC is detected the attack."],"practice":"Identify actor, action and affected object before transforming the sentence.","difficulty":"Intermediário","videos":["v-en-passive","v-en-grammar-search"],"prereq":["den-003"]},{"title":"Cybersecurity vocabulary in context","objective":"Reconhecer vocabulário recorrente sem depender de tradução literal.","summary":"Security texts frequently use words such as breach, threat, vulnerability, patch, compromise, disclosure, outage, credentials and mitigation.","points":["Breach often refers to a security violation or data exposure.","Patch is a correction applied to software.","Credentials identify or authenticate a user.","Mitigation reduces likelihood or impact."],"example":"“The flaw was exploited before a patch was available” means the vulnerability was abused before a correction existed.","recall":"Define breach, patch and mitigation in English or Portuguese.","tags":["cybersecurity","vocabulary"],"q":"In a security report, “credentials were compromised” most likely means that they were:","correct":"exposed, stolen or no longer trustworthy","distractors":["compressed to save space","translated into another language","printed for audit purposes","renewed automatically"],"practice":"Build a personal glossary with the word, context sentence and technical meaning.","difficulty":"Básico","videos":["v-en-reading-search"],"prereq":["den-004"]},{"title":"Inference and FGV reading strategy","objective":"Resolver alternativas que reformulam o texto com nuances.","summary":"FGV-style reading may test paraphrase, scope, negation, modal strength and information not stated. The correct alternative must preserve the passage’s degree of certainty.","points":["Possible is weaker than certain.","Some is not equivalent to all.","Not mentioned differs from contradicted.","A paraphrase may use different words but retain meaning."],"example":"If a text says a control “may reduce risk”, an option saying it “will eliminate risk” overstates the claim.","recall":"Why are absolute words dangerous in reading questions?","tags":["inference","FGV","paraphrase"],"q":"When the passage says an event “may occur”, the closest paraphrase is:","correct":"the event is possible, but not guaranteed","distractors":["the event will certainly occur","the event has already occurred","the event is impossible","the author did not discuss probability"],"practice":"Compare modality, quantity and time between the passage and each alternative.","difficulty":"Avançado","videos":["v-en-reading-search"],"prereq":["den-005"]}]},{"unit":{"id":"dp-gen-logic","title":"Conhecimentos Gerais — Raciocínio Lógico","description":"Proposições, equivalências, argumentos, quantificadores e problemas.","color":"violet","discipline":"Raciocínio Lógico"},"prefix":"drl","order":90,"lessons":[{"title":"Proposições e conectivos","objective":"Distinguir sentenças declarativas e construir proposições compostas.","summary":"Proposição é uma sentença declarativa com valor lógico verdadeiro ou falso. Conectivos formam negação, conjunção, disjunção, condicional e bicondicional.","points":["Perguntas e ordens não são proposições.","Conjunção é verdadeira somente quando ambas são verdadeiras.","Disjunção inclusiva é falsa somente quando ambas são falsas.","Condicional é falsa quando antecedente é verdadeiro e consequente falso."],"example":"“O serviço está disponível e o backup foi validado” é uma conjunção.","recall":"Quando uma condicional é falsa?","tags":["proposições","conectivos"],"q":"A proposição p → q é falsa exatamente quando:","correct":"p é verdadeira e q é falsa","distractors":["p e q são verdadeiras","p é falsa e q é verdadeira","p e q são falsas","p é falsa, independentemente de q"],"practice":"Traduzir a frase para símbolos antes de avaliar o valor lógico.","difficulty":"Básico","videos":["v-dp-logic"],"prereq":[]},{"title":"Tabelas-verdade e classificação","objective":"Calcular valores lógicos e reconhecer tautologia, contradição e contingência.","summary":"A tabela-verdade enumera combinações possíveis dos valores das proposições simples e calcula o resultado da fórmula composta.","points":["Com n proposições simples existem 2ⁿ linhas.","Tautologia é sempre verdadeira.","Contradição é sempre falsa.","Contingência possui resultados verdadeiros e falsos."],"example":"p ∨ ¬p é tautologia porque cobre os dois valores possíveis de p.","recall":"Quantas linhas possui uma tabela com quatro proposições simples?","tags":["tabela-verdade","tautologia"],"q":"Uma fórmula que é verdadeira em todas as linhas de sua tabela é uma:","correct":"tautologia","distractors":["contradição","contingência","falácia informal","proposição aberta"],"practice":"Construir colunas intermediárias para reduzir erros em fórmulas longas.","difficulty":"Básico","videos":["v-dp-logic"],"prereq":["drl-001"]},{"title":"Equivalências e leis de De Morgan","objective":"Simplificar fórmulas e negar proposições compostas.","summary":"Equivalências permitem substituir fórmulas sem alterar o valor lógico. As leis de De Morgan trocam conjunção por disjunção e negam cada componente.","points":["¬(p ∧ q) equivale a ¬p ∨ ¬q.","¬(p ∨ q) equivale a ¬p ∧ ¬q.","p → q equivale a ¬p ∨ q.","A contrapositiva ¬q → ¬p equivale a p → q."],"example":"Negar “o acesso foi autorizado e registrado” produz “o acesso não foi autorizado ou não foi registrado”.","recall":"Escreva a equivalência da condicional p → q.","tags":["equivalências","De Morgan"],"q":"A negação de “p ou q” é:","correct":"não p e não q","distractors":["não p ou não q","p e q","p implica q","p se e somente se q"],"practice":"Aplicar a negação a toda a estrutura, não apenas à primeira proposição.","difficulty":"Intermediário","videos":["v-dp-logic"],"prereq":["drl-002"]},{"title":"Argumentação, validade e inferência","objective":"Avaliar se uma conclusão decorre das premissas.","summary":"Um argumento é válido quando não existe situação em que todas as premissas sejam verdadeiras e a conclusão falsa.","points":["Validade não garante que premissas sejam verdadeiras no mundo real.","Modus ponens usa p → q e p para concluir q.","Modus tollens usa p → q e ¬q para concluir ¬p.","Afirmar o consequente é uma forma inválida."],"example":"Se todo incidente crítico exige comunicação e este incidente é crítico, então ele exige comunicação.","recall":"Diferencie validade e veracidade das premissas.","tags":["argumentação","inferência"],"q":"De p → q e ¬q, pode-se concluir validamente:","correct":"¬p","distractors":["p","q","p ∧ q","nenhuma conclusão sobre p"],"practice":"Representar premissas e testar a forma lógica do argumento.","difficulty":"Intermediário","videos":["v-dp-logic"],"prereq":["drl-003"]},{"title":"Diagramas lógicos e quantificadores","objective":"Interpretar relações de inclusão, existência e universalidade.","summary":"Diagramas representam relações entre conjuntos; quantificadores expressam “todo”, “algum” e “nenhum”. A negação troca universal por existencial e vice-versa.","points":["“Todo A é B” indica inclusão de A em B.","“Algum A é B” exige interseção não vazia.","Negar “todo A é B” resulta em “algum A não é B”.","Negar “existe A com propriedade P” resulta em “nenhum A possui P”."],"example":"A negação de “todos os backups foram testados” é “pelo menos um backup não foi testado”.","recall":"Negue: “Existe um usuário com acesso privilegiado”.","tags":["diagramas","quantificadores"],"q":"A negação de “todos os controles são eficazes” é:","correct":"existe pelo menos um controle que não é eficaz","distractors":["nenhum controle é eficaz","todos os controles são ineficazes","existe pelo menos um controle eficaz","alguns controles podem ser eficazes"],"practice":"Traduzir “todo”, “algum” e “nenhum” antes de desenhar o diagrama.","difficulty":"Intermediário","videos":["v-dp-logic"],"prereq":["drl-004"]},{"title":"Problemas aritméticos, geométricos e matriciais","objective":"Modelar problemas curtos com equações, proporções e padrões.","summary":"Questões lógicas podem combinar porcentagens, razão, áreas, sequências e leitura de matrizes. O foco é transformar condições em relações verificáveis.","points":["Porcentagem deve ser aplicada à base correta.","Proporções comparam grandezas compatíveis.","Matrizes organizam dados por linha e coluna.","A resposta deve ser verificada nas condições originais."],"example":"Se 20% de 150 alertas são falsos positivos, então 30 alertas pertencem a essa categoria.","recall":"Qual é a diferença entre aumento de 20% e aumento de 20 pontos percentuais?","tags":["aritmética","matrizes","problemas"],"q":"Uma equipe resolveu 3/5 de 100 ocorrências. Quantas permanecem?","correct":"40","distractors":["20","50","60","80"],"practice":"Definir a incógnita, escrever a relação e conferir a unidade do resultado.","difficulty":"Intermediário","videos":["v-dp-logic"],"prereq":["drl-005"]}]},{"unit":{"id":"dp-gen-ai","title":"Conhecimentos Gerais — Atualidades e Inteligência Artificial","description":"Método de atualização, fundamentos de IA, modelos generativos, ética e privacidade.","color":"rose","discipline":"Atualidades e IA"},"prefix":"dai","order":96,"lessons":[{"title":"Atualidades: método, fontes e validade temporal","objective":"Estudar acontecimentos recentes sem confundir opinião, fato e desinformação.","summary":"Atualidades exige acompanhamento periódico de fontes confiáveis, registro de data e contexto e conexão dos fatos com temas do edital.","points":["Notícia deve ser identificada por data e fonte.","Fato, análise e opinião precisam ser separados.","Uma informação pode ficar desatualizada rapidamente.","Temas devem ser relacionados a segurança, tecnologia, economia, política, sociedade e sustentabilidade."],"example":"Uma questão sobre regulação tecnológica exige saber o fato, o órgão envolvido, o período e as consequências discutidas.","recall":"Quais sinais aumentam a confiabilidade de uma notícia?","tags":["atualidades","fontes","desinformação"],"q":"Para estudar atualidades de forma confiável, a prática mais adequada é:","correct":"comparar fontes, registrar a data e distinguir fato de opinião","distractors":["memorizar títulos sem abrir as matérias","usar apenas mensagens encaminhadas","ignorar a data de publicação","considerar toda postagem viral como evidência"],"practice":"Manter um resumo mensal com fonte, data, tema e impacto possível na prova.","difficulty":"Básico","videos":["v-dp-ai"],"prereq":[]},{"title":"Fundamentos de IA e aprendizado de máquina","objective":"Distinguir IA, machine learning e tipos de aprendizado.","summary":"Inteligência artificial reúne técnicas para executar tarefas associadas a percepção, raciocínio e decisão. Machine learning aprende padrões a partir de dados.","points":["Aprendizado supervisionado usa exemplos rotulados.","Não supervisionado busca estruturas sem rótulos completos.","Reforço aprende por recompensas e interações.","Dados e métricas influenciam o desempenho do modelo."],"example":"Um classificador de mensagens maliciosas treinado com exemplos rotulados utiliza aprendizado supervisionado.","recall":"Dê um exemplo de aprendizado não supervisionado.","tags":["IA","machine learning"],"q":"Um modelo treinado com pares de entrada e classe conhecida utiliza aprendizado:","correct":"supervisionado","distractors":["não supervisionado","por reforço exclusivamente","simbólico sem dados","aleatório sem objetivo"],"practice":"Identificar dados de entrada, resultado esperado e métrica antes de classificar a abordagem.","difficulty":"Básico","videos":["v-dp-ai"],"prereq":["dai-001"]},{"title":"Modelos generativos e modelos de linguagem","objective":"Compreender geração probabilística, contexto e limitações.","summary":"Modelos generativos produzem novos conteúdos com base em padrões aprendidos. Modelos de linguagem estimam sequências prováveis de tokens e podem responder com informação incorreta.","points":["Prompt orienta, mas não garante veracidade.","Contexto disponível limita a resposta.","Alucinação é conteúdo plausível sem suporte confiável.","Avaliação humana e fontes continuam necessárias."],"example":"Um modelo pode criar uma referência inexistente; por isso, documentos e fatos devem ser verificados.","recall":"Por que fluência textual não prova exatidão factual?","tags":["IA generativa","LLM","alucinação"],"q":"Uma limitação importante de modelos de linguagem é:","correct":"gerar respostas plausíveis que podem conter fatos incorretos","distractors":["sempre apresentar a fonte original de cada frase","funcionar apenas com números","não conseguir produzir linguagem natural","eliminar qualquer viés presente nos dados"],"practice":"Verificar afirmações relevantes em fontes primárias, especialmente em leis e normas.","difficulty":"Intermediário","videos":["v-dp-ai"],"prereq":["dai-002"]},{"title":"Ética, viés, governança e privacidade em IA","objective":"Avaliar riscos sociais, jurídicos e organizacionais.","summary":"Governança de IA define papéis, critérios, documentação, supervisão e controles para uso responsável, considerando viés, privacidade, transparência e segurança.","points":["Dados enviesados podem produzir resultados discriminatórios.","Minimização reduz coleta desnecessária.","Explicabilidade deve ser proporcional ao risco.","Supervisão humana não deve ser apenas formal."],"example":"Um sistema usado para decisões relevantes deve ser testado por grupos, monitorado e possuir mecanismo de contestação.","recall":"Como privacidade e qualidade de dados se relacionam em IA?","tags":["ética","governança","privacidade"],"q":"Uma medida coerente com governança responsável de IA é:","correct":"documentar finalidade, dados, métricas, riscos e responsáveis","distractors":["usar qualquer dado disponível sem base definida","ocultar limitações do modelo","dispensar monitoramento após implantação","tratar acurácia média como único critério"],"practice":"Aplicar avaliação de impacto e controles proporcionais ao uso e às pessoas afetadas.","difficulty":"Intermediário","videos":["v-dp-ai"],"prereq":["dai-003"]},{"title":"IA aplicada à cibersegurança","objective":"Relacionar automação, detecção, defesa e uso adversarial.","summary":"IA pode auxiliar classificação de alertas, detecção de anomalias e análise de texto, mas também pode apoiar phishing, fraude, evasão e produção de código malicioso.","points":["Modelos dependem de dados representativos.","Falsos positivos e falsos negativos permanecem.","Ataques adversariais podem manipular entradas.","Decisões críticas exigem validação e trilhas de auditoria."],"example":"Um modelo de priorização de alertas deve ser monitorado para não ocultar padrões novos ou raros.","recall":"Cite um uso defensivo e um risco ofensivo de IA.","tags":["IA","cibersegurança","detecção"],"q":"Ao usar IA para priorizar alertas, a equipe deve:","correct":"monitorar métricas, erros e mudanças no padrão de dados","distractors":["eliminar completamente a revisão humana","presumir que o modelo nunca envelhece","ignorar falsos negativos","usar somente a pontuação sem contexto"],"practice":"Tratar a saída do modelo como evidência auxiliar, não como decisão infalível.","difficulty":"Avançado","videos":["v-dp-ai"],"prereq":["dai-004"]}]},{"unit":{"id":"dp-gen-law","title":"Conhecimentos Gerais — Legislação Digital e Proteção de Dados","description":"LAI, decretos, delitos informáticos, Marco Civil e LGPD nos recortes do edital.","color":"amber","discipline":"Legislação"},"prefix":"dlw","order":101,"lessons":[{"title":"Lei de Acesso à Informação: princípios e abrangência","objective":"Reconhecer publicidade como regra e sigilo como exceção.","summary":"A LAI disciplina o acesso a informações públicas e alcança órgãos e entidades dos diferentes Poderes e níveis federativos, nos termos legais.","points":["Publicidade é a regra geral.","O acesso pode ser ativo ou mediante pedido.","A informação deve ser gerida com autenticidade e integridade.","Restrições precisam de fundamento legal."],"example":"Um órgão deve divulgar espontaneamente informações de interesse coletivo, sem aguardar pedidos individuais.","recall":"Qual é a regra geral da LAI sobre publicidade e sigilo?","tags":["LAI","transparência"],"q":"Segundo a lógica da LAI, o acesso à informação pública é:","correct":"a regra, enquanto o sigilo é exceção legalmente fundamentada","distractors":["sempre dependente de justificativa do requerente","permitido apenas a servidores públicos","substituído por comunicação verbal","vedado para documentos digitais"],"practice":"Identificar se a questão trata de transparência ativa, pedido de acesso ou restrição legal.","difficulty":"Básico","videos":["v-dp-lai"],"prereq":[]},{"title":"Pedidos de acesso e transparência ativa","objective":"Distinguir divulgação espontânea e atendimento a requerimentos.","summary":"Transparência ativa é a divulgação de iniciativa do órgão; transparência passiva é a resposta a pedidos formulados por interessados pelos meios legítimos.","points":["O pedido deve identificar o requerente e especificar a informação.","Não se deve exigir justificativa sobre o motivo do pedido.","Negativas precisam informar fundamentos e possibilidades de recurso.","Sítios oficiais devem oferecer alternativa de encaminhamento."],"example":"Um cidadão pode solicitar um documento específico sem explicar por que deseja conhecê-lo.","recall":"O requerente precisa apresentar a motivação do pedido?","tags":["LAI","pedido de acesso"],"q":"Em regra, para solicitar informação pública, o interessado:","correct":"não precisa justificar a finalidade do pedido","distractors":["precisa demonstrar interesse jurídico direto","deve ser brasileiro nato","precisa obter autorização judicial","só pode formular pedido presencial"],"practice":"Verificar requisitos do pedido, prazo, resposta, negativa e recurso.","difficulty":"Intermediário","videos":["v-dp-lai"],"prereq":["dlw-001"]},{"title":"Classificação, informação pessoal e Decreto 7.724/2012","objective":"Diferenciar restrições por sigilo e proteção de informações pessoais.","summary":"O Decreto 7.724 regulamenta a LAI no Executivo federal, incluindo procedimentos de acesso e classificação. Informações pessoais recebem proteção própria e não se confundem automaticamente com informação classificada.","points":["Classificação exige autoridade, fundamento, grau e prazo.","Informação pessoal se relaciona à pessoa identificada ou identificável.","A negativa deve ser motivada.","Desclassificação torna a informação acessível quando não houver outra restrição."],"example":"Um documento pode conter partes públicas e partes protegidas, permitindo acesso por certidão, extrato ou cópia com ocultação do trecho restrito.","recall":"Por que informação pessoal não é sinônimo de informação classificada?","tags":["Decreto 7724","sigilo","dados pessoais"],"q":"Quando apenas parte de um documento está protegida, a solução compatível com a LAI é:","correct":"fornecer a parte acessível com ocultação do conteúdo restrito","distractors":["negar automaticamente o documento inteiro","publicar todos os dados pessoais","destruir a parte protegida","exigir ordem judicial em qualquer caso"],"practice":"Separar o fundamento da restrição e verificar se é possível conceder acesso parcial.","difficulty":"Intermediário","videos":["v-dp-lai"],"prereq":["dlw-002"]},{"title":"Decreto 7.845/2012 e tratamento de informação classificada","objective":"Compreender credenciamento de segurança e medidas de proteção.","summary":"O Decreto 7.845 trata de credenciamento de segurança e tratamento de informação classificada no Executivo federal, abrangendo acesso, custódia, transmissão, reprodução e descarte.","points":["Acesso depende de necessidade de conhecer e credenciamento quando aplicável.","Ambientes e sistemas devem adotar medidas proporcionais ao grau de sigilo.","Incidentes com informação classificada exigem tratamento específico.","O Termo de Classificação documenta decisões pertinentes."],"example":"Uma pessoa credenciada não recebe acesso irrestrito: ainda precisa demonstrar necessidade funcional de conhecer a informação.","recall":"O que significa necessidade de conhecer?","tags":["Decreto 7845","informação classificada"],"q":"O credenciamento de segurança, por si só:","correct":"não elimina a exigência de necessidade de conhecer","distractors":["autoriza acesso a toda informação sigilosa","substitui controles físicos e lógicos","torna pública a informação classificada","dispensa registro de acesso"],"practice":"Relacionar grau de sigilo, credenciamento, necessidade e medidas de tratamento.","difficulty":"Avançado","videos":["v-dp-lai"],"prereq":["dlw-003"]},{"title":"Lei 12.737/2012 e invasão de dispositivo informático","objective":"Reconhecer a tipificação indicada no edital e seus elementos.","summary":"A Lei 12.737 inseriu no Código Penal o crime de invasão de dispositivo informático, além de outras alterações. A análise de prova deve observar a redação legal vigente.","points":["O tipo protege dispositivo e dados contra invasão não autorizada.","Finalidade e conduta descritas em lei são relevantes.","A autorização do titular altera a análise da tipicidade.","Questões podem cobrar diferenças entre crime, incidente e vulnerabilidade."],"example":"Explorar um sistema em laboratório expressamente autorizado não se confunde com invadir dispositivo alheio sem autorização.","recall":"Por que autorização e escopo são essenciais em testes de segurança?","tags":["Lei 12737","delitos informáticos"],"q":"Em um teste de penetração profissional, a principal medida jurídica preventiva é:","correct":"obter autorização expressa e definir o escopo","distractors":["ocultar a atividade da organização","testar qualquer ativo conectado","dispensar regras de engajamento","publicar dados encontrados"],"practice":"Ler o artigo cobrado e identificar conduta, objeto, autorização e finalidade.","difficulty":"Intermediário","videos":["v-dp-direito"],"prereq":[]},{"title":"Marco Civil: princípios, direitos e neutralidade","objective":"Analisar garantias, privacidade e disciplina do uso da internet.","summary":"O Marco Civil estabelece princípios, garantias, direitos e deveres para o uso da internet no Brasil, incluindo liberdade de expressão, privacidade, proteção de dados e neutralidade de rede.","points":["A disciplina busca preservar direitos fundamentais.","Neutralidade trata do tratamento isonômico de pacotes, observadas exceções legais.","Registros possuem regras específicas de guarda e acesso.","Provedores de conexão e aplicação possuem regimes distintos."],"example":"Uma questão pode distinguir conteúdo das comunicações, registros de conexão e registros de acesso a aplicações.","recall":"O que a neutralidade de rede busca proteger?","tags":["Marco Civil","neutralidade","privacidade"],"q":"O Marco Civil da Internet estabelece:","correct":"princípios, garantias, direitos e deveres para o uso da internet no Brasil","distractors":["apenas crimes praticados por computadores","somente regras tributárias para provedores","exclusivamente padrões técnicos de Wi-Fi","apenas direitos autorais em redes sociais"],"practice":"Identificar o capítulo e a seção exigidos no edital antes de estudar detalhes fora do recorte.","difficulty":"Intermediário","videos":["v-dp-direito"],"prereq":["dlw-005"]},{"title":"LGPD: fundamentos, princípios, agentes e bases legais","objective":"Organizar os elementos centrais do tratamento de dados pessoais.","summary":"A LGPD disciplina o tratamento de dados pessoais, define agentes, princípios, direitos e hipóteses legais. A base deve corresponder à finalidade e ao contexto do tratamento.","points":["Controlador decide sobre o tratamento.","Operador trata dados em nome do controlador.","Princípios incluem finalidade, adequação, necessidade e segurança.","Consentimento é uma entre várias bases legais."],"example":"Uma empresa pode tratar dados para cumprir obrigação legal sem depender de consentimento, quando os requisitos estiverem presentes.","recall":"Qual é a diferença entre controlador e operador?","tags":["LGPD","bases legais","agentes"],"q":"Na LGPD, o consentimento:","correct":"é uma das bases legais, não a única","distractors":["é obrigatório para todo tratamento","dispensa informação ao titular","substitui medidas de segurança","autoriza qualquer finalidade futura"],"practice":"Identificar dado, finalidade, agente, base legal e princípio aplicável em cada cenário.","difficulty":"Intermediário","videos":["v-dp-lgpd"],"prereq":["dlw-006"]},{"title":"LGPD: direitos, segurança, incidentes e sanções","objective":"Relacionar governança, direitos dos titulares e responsabilização.","summary":"A lei prevê direitos dos titulares, deveres de segurança, comunicação de incidentes quando aplicável, fiscalização e sanções administrativas.","points":["Direitos incluem confirmação, acesso, correção e outras hipóteses legais.","Agentes devem adotar medidas técnicas e administrativas.","Incidentes exigem avaliação de risco e procedimentos de resposta.","A ANPD possui competências regulatórias e fiscalizatórias."],"example":"Um incidente com dados pessoais deve ser contido, investigado, documentado e avaliado quanto às comunicações exigidas.","recall":"Quais fatores devem ser avaliados após um incidente com dados pessoais?","tags":["LGPD","incidentes","sanções"],"q":"Uma medida coerente com a LGPD após incidente é:","correct":"conter, avaliar riscos, documentar e realizar comunicações cabíveis","distractors":["apagar todos os registros do ocorrido","ocultar o evento da governança","presumir que não há impacto sem análise","publicar os dados para demonstrar transparência"],"practice":"Integrar resposta técnica, privacidade, jurídico e comunicação, mantendo evidências.","difficulty":"Avançado","videos":["v-dp-lgpd"],"prereq":["dlw-007"]}]},{"unit":{"id":"dp-gov","title":"Conhecimentos Específicos — Gestão e Governança de TI","description":"Projetos ágeis, processos, riscos, ITIL 4 e COBIT 2019.","color":"green","discipline":"Governança de TI"},"prefix":"dgv","order":109,"lessons":[{"title":"Governança e gestão de TI","objective":"Diferenciar direção e controle de execução e operação.","summary":"Governança avalia necessidades, direciona prioridades e monitora resultados; gestão planeja, constrói, executa e acompanha atividades alinhadas ao direcionamento.","points":["Governança responde a partes interessadas.","Gestão usa recursos para atingir objetivos.","Papéis precisam de responsabilidade e prestação de contas.","Indicadores conectam decisões a resultados."],"example":"O conselho define apetite a risco e objetivos; a gestão implementa processos e controles para atendê-los.","recall":"Dê um exemplo de decisão de governança e outro de gestão.","tags":["governança","gestão"],"q":"A atividade mais associada à governança é:","correct":"avaliar necessidades, direcionar prioridades e monitorar resultados","distractors":["executar rotinas de backup","configurar um firewall","resolver um chamado individual","instalar uma atualização de sistema"],"practice":"Perguntar quem decide, quem executa e quem monitora em cada cenário.","difficulty":"Básico","videos":["v-dp-cobit"],"prereq":[]},{"title":"Gerenciamento ágil de projetos","objective":"Compreender entrega incremental, valor e adaptação.","summary":"Abordagens ágeis trabalham com ciclos curtos, priorização por valor, feedback frequente e adaptação, sem eliminar planejamento ou governança.","points":["Backlog organiza trabalho priorizado.","Iterações produzem incrementos verificáveis.","Feedback reduz risco de entregar solução inadequada.","Transparência e definição de pronto apoiam qualidade."],"example":"Uma equipe entrega uma pequena melhoria, coleta feedback e ajusta o próximo ciclo.","recall":"Por que agilidade não significa ausência de planejamento?","tags":["ágil","projetos"],"q":"Em gerenciamento ágil, o backlog deve ser:","correct":"priorizado e refinado conforme valor, risco e aprendizado","distractors":["fixado definitivamente no início","mantido secreto da equipe","ordenado apenas pela duração","substituído por atividades sem objetivo"],"practice":"Definir objetivo, critérios de aceitação e valor esperado para cada incremento.","difficulty":"Básico","videos":["v-dp-agile"],"prereq":["dgv-001"]},{"title":"Processos, grupos e áreas de conhecimento","objective":"Organizar o trabalho de projeto e seus relacionamentos.","summary":"Processos de gerenciamento transformam entradas em saídas por técnicas e ferramentas. Grupos representam lógica de iniciação, planejamento, execução, monitoramento e encerramento, sem serem necessariamente fases rígidas.","points":["Processos interagem e podem se repetir.","Planejamento é progressivamente detalhado.","Monitoramento compara realizado e planejado.","Encerramento formaliza aceitação e aprendizado."],"example":"Uma mudança aprovada pode exigir retorno ao planejamento e atualização de linhas de base.","recall":"Por que grupos de processos não são sempre fases sequenciais?","tags":["processos","projetos"],"q":"Monitorar e controlar um projeto significa:","correct":"comparar desempenho, analisar variações e decidir ações","distractors":["executar apenas a primeira reunião","eliminar toda mudança","dispensar critérios de aceitação","encerrar antes da entrega"],"practice":"Relacionar cada artefato à decisão que ele apoia.","difficulty":"Intermediário","videos":["v-dp-agile"],"prereq":["dgv-002"]},{"title":"Gestão de riscos em projetos e serviços","objective":"Integrar incertezas a decisões de priorização.","summary":"Riscos podem afetar objetivos positiva ou negativamente. A gestão identifica, analisa, planeja respostas, atribui responsáveis e monitora gatilhos.","points":["Risco não é o mesmo que problema ocorrido.","Probabilidade e impacto apoiam priorização.","Respostas devem ter responsáveis.","Risco residual permanece após respostas."],"example":"Uma dependência de fornecedor é registrada com probabilidade, impacto, responsável e plano alternativo.","recall":"Qual é a diferença entre risco e issue?","tags":["riscos","projetos","serviços"],"q":"Um risco torna-se um problema quando:","correct":"o evento incerto ocorre e passa a exigir tratamento do fato","distractors":["é apenas identificado","recebe um responsável","é documentado no registro","possui baixa probabilidade"],"practice":"Revisar riscos em cadência definida e quando houver mudanças relevantes.","difficulty":"Intermediário","videos":["v-dp-risk"],"prereq":["dgv-003"]},{"title":"ITIL 4: valor, princípios e sistema de valor de serviço","objective":"Entender a visão sistêmica do gerenciamento de serviços.","summary":"ITIL 4 orienta a criação conjunta de valor por serviços por meio de princípios, governança, cadeia de valor, práticas e melhoria contínua.","points":["Serviço facilita resultados desejados sem o cliente gerenciar custos e riscos específicos.","Valor é cocriado com partes interessadas.","Princípios orientadores apoiam decisões em diferentes contextos.","O sistema de valor integra componentes e atividades."],"example":"Ao melhorar um portal, a equipe considera experiência do usuário, fluxo ponta a ponta e resultados, não apenas tecnologia.","recall":"O que significa focar em valor?","tags":["ITIL 4","serviços","valor"],"q":"Um princípio orientador do ITIL 4 é:","correct":"focar em valor","distractors":["evitar qualquer automação","trabalhar sempre em grandes lotes","ignorar o estado atual","otimizar cada equipe isoladamente"],"practice":"Conectar cada atividade ao resultado percebido pelo consumidor e pela organização.","difficulty":"Intermediário","videos":["v-dp-itil"],"prereq":["dgv-004"]},{"title":"ITIL 4: cadeia de valor e práticas","objective":"Relacionar incidentes, problemas, mudanças e níveis de serviço.","summary":"A cadeia de valor combina atividades para responder a demanda e criar valor. Práticas como incident management, problem management, change enablement e service level management tratam objetivos distintos.","points":["Incidente busca restaurar o serviço rapidamente.","Problema investiga causas e reduz recorrência.","Mudança é avaliada e autorizada conforme risco.","Nível de serviço define metas acordadas e mensuráveis."],"example":"Restaurar um serviço por workaround resolve o incidente, mas a causa pode continuar como problema.","recall":"Diferencie incidente e problema no ITIL.","tags":["ITIL 4","incidente","mudança"],"q":"A prática que busca reduzir a probabilidade e o impacto de incidentes por análise de causas é:","correct":"gerenciamento de problemas","distractors":["service desk","gerenciamento de incidentes apenas","gerenciamento financeiro","gestão de portfólio"],"practice":"Classificar o objetivo da prática antes de escolher o processo ou ferramenta.","difficulty":"Intermediário","videos":["v-dp-itil"],"prereq":["dgv-005"]},{"title":"COBIT 2019: princípios, sistema e modelo central","objective":"Compreender governança empresarial de informação e tecnologia.","summary":"COBIT 2019 é um framework para governança e gestão de informação e tecnologia em toda a empresa. Seu modelo central reúne objetivos de governança e gestão.","points":["Governança e gestão possuem objetivos distintos.","O sistema deve ser adaptado por fatores de desenho.","Componentes incluem processos, estruturas, informação, pessoas e políticas.","O modelo central possui objetivos organizados em domínios."],"example":"Uma organização adapta prioridades do COBIT conforme estratégia, perfil de risco, ameaças e modelo de sourcing.","recall":"Por que o COBIT não deve ser aplicado como checklist idêntico em toda organização?","tags":["COBIT 2019","governança"],"q":"No COBIT 2019, os fatores de desenho ajudam a:","correct":"adaptar o sistema de governança ao contexto da empresa","distractors":["eliminar a necessidade de objetivos","substituir toda gestão operacional","definir apenas configurações de rede","tornar todos os controles obrigatórios e idênticos"],"practice":"Relacionar objetivo empresarial, risco, componente e objetivo de governança ou gestão.","difficulty":"Avançado","videos":["v-dp-cobit"],"prereq":["dgv-006"]}]},{"unit":{"id":"dp-cloud","title":"Conhecimentos Específicos — Computação em Nuvem","description":"Modelos, arquitetura, identidade, conformidade, IaC e serviços AWS, Azure e Google Cloud.","color":"cyan","discipline":"Computação em Nuvem"},"prefix":"dcl","order":116,"lessons":[{"title":"Características essenciais e modelos de serviço","objective":"Distinguir cloud computing, IaaS, PaaS e SaaS.","summary":"Nuvem oferece recursos sob demanda, acesso por rede, agrupamento, elasticidade e serviço mensurado. Modelos de serviço distribuem responsabilidades entre provedor e cliente.","points":["IaaS oferece infraestrutura virtualizada.","PaaS oferece plataforma gerenciada para aplicações.","SaaS entrega aplicação pronta ao usuário.","O cliente mantém responsabilidades de dados, identidades e configurações conforme o modelo."],"example":"Em IaaS, o provedor opera datacenter e virtualização, enquanto o cliente normalmente administra sistema operacional e aplicações.","recall":"Compare a responsabilidade do cliente em IaaS e SaaS.","tags":["cloud","IaaS","PaaS","SaaS"],"q":"O modelo que entrega uma aplicação pronta, acessada como serviço, é:","correct":"SaaS","distractors":["IaaS","PaaS","bare metal obrigatório","LAN"],"practice":"Listar o que é gerenciado pelo provedor e pelo cliente em cada modelo.","difficulty":"Básico","videos":["v-dp-cloud-basics"],"prereq":[]},{"title":"Nuvem pública, privada e híbrida","objective":"Escolher modelos de implantação conforme requisitos.","summary":"Nuvem pública usa infraestrutura compartilhada do provedor; privada é dedicada a uma organização; híbrida integra ambientes com governança e conectividade.","points":["Híbrida não é apenas possuir dois ambientes desconectados.","Privada não elimina a necessidade de segurança.","Pública pode oferecer isolamento lógico e serviços gerenciados.","Requisitos de latência, dados, custo e conformidade influenciam a escolha."],"example":"Uma empresa mantém dados sensíveis em ambiente privado e usa capacidade pública para picos, com integração controlada.","recall":"Quais requisitos podem levar a uma arquitetura híbrida?","tags":["cloud pública","privada","híbrida"],"q":"Uma nuvem híbrida pressupõe:","correct":"integração e coordenação entre ambientes distintos","distractors":["uso exclusivo de um único datacenter","ausência de conectividade","eliminação de governança","somente aplicações SaaS"],"practice":"Mapear dados, dependências, latência e controles antes de definir o modelo.","difficulty":"Básico","videos":["v-dp-cloud-basics"],"prereq":["dcl-001"]},{"title":"Regiões, zonas e alta disponibilidade","objective":"Projetar resiliência considerando domínios de falha.","summary":"Regiões são áreas geográficas; zonas de disponibilidade são locais isolados dentro de uma região. Distribuir componentes reduz impacto de falhas locais.","points":["Alta disponibilidade reduz interrupções planejadas e não planejadas.","Múltiplas zonas não substituem backup.","Arquitetura multirregião aumenta complexidade e custo.","RTO e RPO orientam decisões de resiliência."],"example":"Uma aplicação distribui instâncias em duas zonas e usa balanceador de carga para suportar falha de uma zona.","recall":"Por que backup e alta disponibilidade não são sinônimos?","tags":["regiões","zonas","alta disponibilidade"],"q":"Distribuir instâncias por zonas de disponibilidade busca principalmente:","correct":"reduzir o impacto de falha em um domínio físico","distractors":["eliminar a necessidade de autenticação","transformar IaaS em SaaS","dispensar testes de recuperação","garantir custo zero"],"practice":"Identificar os domínios de falha e testar o comportamento quando um deles fica indisponível.","difficulty":"Intermediário","videos":["v-dp-aws","v-dp-azure","v-dp-gcp"],"prereq":["dcl-002"]},{"title":"Elasticidade, escalabilidade e custos","objective":"Diferenciar ajuste automático e capacidade de crescimento.","summary":"Escalabilidade é a capacidade de aumentar ou reduzir recursos; elasticidade é a adaptação dinâmica à demanda. Serviço mensurado permite cobrança e otimização.","points":["Scale up aumenta capacidade de um recurso.","Scale out adiciona instâncias.","Elasticidade pode automatizar expansão e redução.","FinOps conecta custo, uso e valor."],"example":"Um grupo adiciona servidores durante um pico e os remove após a demanda cair.","recall":"Diferencie escalabilidade e elasticidade.","tags":["elasticidade","escalabilidade","custos"],"q":"Adicionar novas instâncias para dividir a carga caracteriza:","correct":"escalabilidade horizontal","distractors":["escalabilidade vertical","compressão de dados","classificação de informação","autenticação federada"],"practice":"Usar métricas de demanda e limites para evitar tanto indisponibilidade quanto desperdício.","difficulty":"Intermediário","videos":["v-dp-cloud-basics"],"prereq":["dcl-003"]},{"title":"Responsabilidade compartilhada, IAM e Zero Trust","objective":"Aplicar controles de identidade e configuração em nuvem.","summary":"O provedor protege a infraestrutura da nuvem; o cliente protege seus dados, identidades, permissões e configurações conforme o serviço. IAM deve aplicar menor privilégio e autenticação forte.","points":["Conta raiz deve ter uso restrito.","Papéis temporários são preferíveis a chaves permanentes.","MFA reduz risco de credenciais.","Zero Trust exige verificação contínua e contexto."],"example":"Um bucket público por erro de configuração é normalmente responsabilidade do cliente que definiu a política.","recall":"O que significa responsabilidade compartilhada?","tags":["cloud security","IAM","Zero Trust"],"q":"Uma boa prática de IAM em nuvem é:","correct":"usar papéis de curta duração e menor privilégio","distractors":["compartilhar a conta administrativa","manter chaves sem rotação","conceder acesso amplo por conveniência","desabilitar logs de autenticação"],"practice":"Revisar identidades, políticas, chaves e configurações públicas continuamente.","difficulty":"Intermediário","videos":["v-dp-cloud-security"],"prereq":["dcl-004"]},{"title":"Privacidade, conformidade e proteção de dados na nuvem","objective":"Avaliar localização, criptografia, contratos e evidências.","summary":"Uso de nuvem exige compreender dados tratados, regiões, subcontratados, controles, responsabilidades, retenção, exclusão e requisitos de auditoria.","points":["Classificação orienta serviços e controles.","Criptografia exige gestão adequada de chaves.","Certificações do provedor não tornam o cliente automaticamente conforme.","Logs e contratos apoiam responsabilização."],"example":"Uma organização avalia onde os dados serão armazenados, quem controla as chaves e como comprovar exclusão e acesso.","recall":"Por que uma certificação do provedor não garante conformidade da aplicação?","tags":["privacidade","conformidade","cloud"],"q":"Em conformidade na nuvem, o cliente deve:","correct":"configurar e operar seus recursos de acordo com requisitos e responsabilidades","distractors":["presumir que todo serviço já está adequado","dispensar contratos e evidências","ignorar localização dos dados","usar uma única chave compartilhada"],"practice":"Criar matriz de responsabilidade e evidências para cada requisito.","difficulty":"Avançado","videos":["v-dp-cloud-security"],"prereq":["dcl-005"]},{"title":"Infrastructure as Code e automação","objective":"Gerenciar infraestrutura de forma declarativa, versionada e testável.","summary":"IaC descreve infraestrutura em código, permitindo revisão, repetibilidade, automação e detecção de desvios, mas também pode propagar erros em escala.","points":["Código deve ser versionado e revisado.","Segredos não devem ficar em repositórios.","Pipelines precisam de testes e aprovação.","Policy as Code valida requisitos automaticamente."],"example":"Uma política impede a criação de armazenamento público durante o pipeline de implantação.","recall":"Qual risco surge quando um template inseguro é reutilizado?","tags":["IaC","automação","policy as code"],"q":"Uma prática segura em IaC é:","correct":"revisar código, testar políticas e separar segredos","distractors":["armazenar senhas no template","alterar produção sem rastreio","dispensar controle de versão","conceder privilégios administrativos ao pipeline"],"practice":"Tratar templates como software: revisão, testes, dependências e rollback.","difficulty":"Intermediário","videos":["v-dp-iac"],"prereq":["dcl-006"]},{"title":"AWS, Azure e Google Cloud: serviços centrais","objective":"Relacionar categorias equivalentes sem decorar apenas marcas.","summary":"Os provedores oferecem computação, armazenamento, redes, bancos, identidade, monitoramento e segurança com nomes diferentes. A prova pode exigir reconhecimento de finalidade.","points":["Máquinas virtuais oferecem computação IaaS.","Object storage guarda objetos com alta durabilidade.","Serviços IAM administram identidades e políticas.","Monitoramento coleta métricas, logs e eventos."],"example":"Amazon EC2, Azure Virtual Machines e Google Compute Engine pertencem à categoria de máquinas virtuais.","recall":"Cite um serviço de object storage de cada provedor.","tags":["AWS","Azure","Google Cloud"],"q":"A associação correta de serviços de object storage é:","correct":"Amazon S3, Azure Blob Storage e Google Cloud Storage","distractors":["EC2, Entra ID e BigQuery","Lambda, Virtual Network e Kubernetes","RDS, Azure Monitor e Cloud DNS","IAM, Functions e Pub/Sub"],"practice":"Estudar por categoria funcional e depois associar os nomes de cada provedor.","difficulty":"Intermediário","videos":["v-dp-aws","v-dp-azure","v-dp-gcp"],"prereq":["dcl-007"]}]},{"unit":{"id":"dp-sec-gaps","title":"Segurança — Complementos Literais do Edital","description":"NIST CSF 1.1, versões normativas, esteganografia, protocolos, Direito Digital e programação segura.","color":"rose","discipline":"Segurança da Informação"},"prefix":"dsg","order":124,"lessons":[{"title":"NIST Cybersecurity Framework 1.1: Core e cinco funções","objective":"Estudar exatamente a versão indicada no edital.","summary":"O CSF 1.1 organiza resultados de cibersegurança em Core, Implementation Tiers e Profiles. O Core utiliza Identify, Protect, Detect, Respond e Recover.","points":["Functions são o nível mais alto do Core.","Categories e Subcategories detalham resultados.","Informative References conectam outras normas e práticas.","A versão 1.1 continua relevante para a prova mesmo existindo CSF 2.0."],"example":"Uma organização pode mapear seus controles de detecção à função Detect e seus planos de recuperação à função Recover.","recall":"Recite as cinco funções na ordem tradicional.","tags":["NIST CSF 1.1","Core","funções"],"q":"No NIST CSF 1.1, as cinco funções são:","correct":"Identify, Protect, Detect, Respond e Recover","distractors":["Govern, Identify, Protect, Detect e Recover","Plan, Build, Run, Monitor e Improve","Prevent, Audit, Correct, Accept e Transfer","Context, Leadership, Support, Operation e Improvement"],"practice":"Classificar cada resultado de segurança pela função antes de memorizar categorias.","difficulty":"Intermediário","videos":["v-dp-nist"],"prereq":[]},{"title":"NIST CSF 1.1: Tiers, Profiles e diferença para 2.0","objective":"Evitar substituir a versão do edital pela versão mais recente.","summary":"Tiers descrevem características da gestão de risco de Partial a Adaptive; Profiles alinham resultados do Core a objetivos, risco e recursos. O CSF 2.0 adicionou Govern e reorganizou categorias.","points":["Tiers não são uma certificação automática de maturidade.","Current e Target Profiles apoiam análise de lacunas.","O edital cita 1.1, logo suas cinco funções devem ser dominadas.","Atualizações podem ser estudadas como comparação, não substituição."],"example":"Uma organização compara o Current Profile ao Target Profile para priorizar melhorias.","recall":"Qual é a finalidade de um Target Profile?","tags":["NIST CSF","Tiers","Profiles"],"q":"No CSF 1.1, um Profile representa:","correct":"o alinhamento de resultados do Core às necessidades e ao contexto da organização","distractors":["um certificado emitido pelo NIST","uma lista fixa de ferramentas obrigatórias","um nível de sigilo de informação","um tipo de algoritmo criptográfico"],"practice":"Responder questões com a terminologia da versão explicitamente indicada.","difficulty":"Avançado","videos":["v-dp-nist"],"prereq":["dsg-001"]},{"title":"ISO/IEC 27005:2019 no edital e versões posteriores","objective":"Controlar versões sem misturar requisitos de prova.","summary":"O edital cita ABNT NBR ISO/IEC 27005:2019. Materiais posteriores podem atualizar terminologia, mas questões devem ser respondidas conforme a versão indicada quando houver conflito.","points":["Versão da norma é parte do conteúdo.","Conceitos estáveis podem ser comparados entre edições.","Mudanças devem ser registradas em nota de atualização.","A 27005 orienta gestão de riscos de segurança da informação."],"example":"Uma aula pode apresentar uma edição nova, mas deve destacar o que a banca pediu e evitar atribuir retroativamente mudanças.","recall":"Como agir quando o edital cita uma edição anterior?","tags":["ISO 27005","versionamento"],"q":"Em prova, quando o edital especifica ISO/IEC 27005:2019, deve-se:","correct":"priorizar a edição indicada e tratar versões posteriores como complemento","distractors":["ignorar o ano informado","usar apenas a edição mais recente sem comparação","substituir a norma por ISO 9001","considerar todas as edições idênticas"],"practice":"Registrar em cada aula a versão-base e a data de revisão.","difficulty":"Avançado","videos":["v-dp-risk"],"prereq":["dsg-002"]},{"title":"Esteganografia e esteganálise","objective":"Diferenciar ocultação da existência da mensagem e proteção do conteúdo.","summary":"Esteganografia oculta a presença de informação em um portador; criptografia transforma o conteúdo para torná-lo ininteligível sem chave. Podem ser combinadas.","points":["Imagens, áudio e metadados podem servir de portadores.","Alterações estatísticas podem revelar ocultação.","Esteganálise busca detectar ou extrair conteúdo oculto.","Ocultação não garante confidencialidade criptográfica."],"example":"Uma mensagem cifrada pode ser escondida nos bits menos significativos de uma imagem.","recall":"Qual é a diferença central entre criptografia e esteganografia?","tags":["esteganografia","esteganálise"],"q":"A esteganografia busca principalmente:","correct":"ocultar a existência da comunicação","distractors":["garantir disponibilidade do sistema","substituir autenticação multifator","calcular um hash de senha","gerenciar certificados digitais"],"practice":"Analisar portador, método de ocultação, capacidade e sinais de detecção.","difficulty":"Intermediário","videos":["v-dp-steg"],"prereq":[]},{"title":"Protocolos criptográficos, TLS, IPsec e PFS","objective":"Compreender autenticação, troca de chaves e proteção de canais.","summary":"Protocolos combinam algoritmos para negociar parâmetros, autenticar partes, derivar chaves e proteger confidencialidade e integridade. TLS protege sessões de aplicação; IPsec protege tráfego IP.","points":["Certificados podem autenticar servidores.","Chaves efêmeras podem oferecer perfect forward secrecy.","Downgrade força parâmetros menos seguros.","Validação de cadeia e nome é essencial em TLS."],"example":"Em um handshake com ECDHE, o comprometimento posterior da chave de longo prazo não revela necessariamente sessões passadas.","recall":"O que significa perfect forward secrecy?","tags":["TLS","IPsec","PFS"],"q":"Perfect forward secrecy busca garantir que:","correct":"o comprometimento futuro de uma chave de longo prazo não exponha sessões passadas","distractors":["todas as chaves sejam públicas","certificados nunca expirem","o tráfego dispense autenticação","uma senha seja reutilizada indefinidamente"],"practice":"Separar objetivos de autenticação, troca de chaves, cifragem e integridade.","difficulty":"Avançado","videos":["v-dp-tls"],"prereq":["dsg-004"]},{"title":"Direito Digital, prova eletrônica e responsabilidade","objective":"Integrar legislação, contratos, incidentes e evidências.","summary":"Direito Digital reúne questões civis, penais, trabalhistas, consumeristas e administrativas relacionadas a tecnologias, dados e redes.","points":["Logs podem ser evidências, mas exigem autenticidade e contexto.","Responsabilidade depende de conduta, dever, dano e nexo conforme o regime aplicável.","Contratos devem definir segurança e tratamento de dados.","Preservação de evidências reduz contestação."],"example":"Após fraude, a organização preserva logs, horários, responsáveis e cadeia de custódia para investigação e eventual processo.","recall":"Quais propriedades tornam uma evidência digital mais confiável?","tags":["Direito Digital","prova digital"],"q":"Uma boa prática na coleta de prova digital é:","correct":"preservar integridade, origem, horários e cadeia de custódia","distractors":["editar o arquivo original para facilitar leitura","apagar metadados","compartilhar a evidência sem registro","ignorar fuso horário"],"practice":"Distinguir resposta técnica, obrigação legal e estratégia processual.","difficulty":"Avançado","videos":["v-dp-direito"],"prereq":["dsg-005"]},{"title":"Programação para segurança: Python, Shell e PowerShell","objective":"Ler e criar pequenas automações defensivas com segurança.","summary":"Scripts podem filtrar logs, consultar APIs e automatizar verificações. Entradas, privilégios, erros e segredos precisam ser controlados.","points":["Validar e normalizar entradas.","Evitar executar comandos construídos por concatenação insegura.","Usar menor privilégio.","Registrar erros sem expor segredos."],"example":"Um script lê JSON de alertas, valida campos e grava somente indicadores relevantes em arquivo protegido.","recall":"Por que concatenar entrada do usuário em um comando de shell é perigoso?","tags":["Python","Shell","PowerShell"],"q":"Para reduzir command injection em um script, deve-se:","correct":"evitar concatenação de entrada e usar APIs ou argumentos validados","distractors":["executar sempre como administrador","desabilitar tratamento de erros","armazenar senhas no código","aceitar qualquer entrada sem limite"],"practice":"Executar scripts em laboratório e revisar impacto antes de automatizar produção.","difficulty":"Intermediário","videos":["v-dp-code"],"prereq":[]},{"title":"C, C++, C#, Java e JavaScript: riscos reconhecíveis","objective":"Identificar falhas comuns sem exigir desenvolvimento completo.","summary":"Linguagens possuem modelos de memória e ecossistemas diferentes. A prova pode cobrar reconhecimento de buffer overflow, injeção, desserialização, XSS e dependências vulneráveis.","points":["C e C++ exigem atenção a limites e memória.","Java e C# usam ambientes gerenciados, mas continuam sujeitos a falhas lógicas e injeção.","JavaScript no navegador se relaciona a XSS e DOM.","Validação de entrada não substitui codificação de saída."],"example":"Copiar dados sem verificar tamanho para um buffer fixo pode causar corrupção de memória em C.","recall":"Qual classe de falha é comum em C/C++ por acesso fora dos limites?","tags":["C","Java","JavaScript","segurança de código"],"q":"Para prevenir XSS ao exibir dados não confiáveis, uma medida central é:","correct":"aplicar codificação de saída adequada ao contexto","distractors":["desabilitar logs","usar apenas comentários no código","converter todo dado em número","executar o navegador como administrador"],"practice":"Associar linguagem, runtime, entrada não confiável e controle apropriado.","difficulty":"Avançado","videos":["v-dp-code"],"prereq":["dsg-007"]},{"title":"GitLab, React, Spring e Kafka sob a ótica de segurança","objective":"Reconhecer superfície de ataque e controles em tecnologias do edital.","summary":"GitLab integra repositório e CI/CD; React constrói interfaces; Spring fornece ecossistema Java; Kafka transporta eventos. Cada tecnologia exige autenticação, segredos, dependências, configuração e monitoramento.","points":["Pipelines não devem expor tokens em logs.","React não elimina XSS quando conteúdo é inserido de forma insegura.","Spring Security ajuda, mas precisa de configuração correta.","Kafka exige ACLs, criptografia e proteção de tópicos."],"example":"Um token de implantação vazado no log do pipeline pode permitir acesso ao ambiente de produção.","recall":"Cite um controle de segurança para Kafka.","tags":["GitLab","React","Spring","Kafka"],"q":"Uma prática segura em pipelines GitLab é:","correct":"armazenar segredos em mecanismo protegido e limitar permissões","distractors":["gravar tokens no repositório","exibir credenciais em logs","usar o mesmo usuário administrativo em todos os jobs","desabilitar revisão de código"],"practice":"Estudar finalidade, dados, identidades, interfaces e configurações de cada tecnologia.","difficulty":"Avançado","videos":["v-dp-devsecops"],"prereq":["dsg-008"]},{"title":"Proxy direto, proxy reverso e VPNs IPsec/SSL","objective":"Distinguir intermediação, publicação e túneis seguros.","summary":"Forward proxy representa clientes ao acessar destinos; reverse proxy representa servidores diante dos clientes. VPN cria canal protegido, podendo usar IPsec ou tecnologias baseadas em TLS/SSL.","points":["Proxy pode filtrar, registrar e aplicar políticas.","Reverse proxy pode terminar TLS e proteger aplicações.","IPsec opera na camada de rede.","SSL VPN costuma facilitar acesso remoto a aplicações ou redes."],"example":"Um WAF pode ser implantado junto a reverse proxy diante de aplicações web.","recall":"Qual é a diferença entre forward e reverse proxy?","tags":["proxy","VPN","IPsec","SSL VPN"],"q":"Um reverse proxy fica tipicamente:","correct":"diante de servidores, recebendo requisições dos clientes","distractors":["somente dentro do navegador do usuário","substituindo o cabo de rede","dentro de um certificado digital","apenas em redes sem fio"],"practice":"Desenhar cliente, intermediário, servidor e ponto de terminação do túnel.","difficulty":"Intermediário","videos":["v-dp-proxy"],"prereq":["dsg-009"]}]}];
 dpModules.forEach(m=>addSpecs(dp,m.unit,m.prefix,m.order,m.lessons,m.unit.discipline));
 const asonModules=[{"unit_id":"ason-eng-verbs","prefix":"afx-en","order":20,"lessons":[{"title":"So, neither, nor e auxiliares em respostas curtas","objective":"Usar concordância positiva e negativa com o auxiliar adequado.","summary":"Para concordar com uma afirmação usa-se so + auxiliar + sujeito; para concordar com uma negativa usa-se neither/nor + auxiliar + sujeito. O auxiliar acompanha tempo, modal ou verbo be.","points":["I am ready — So am I.","I can swim — So can she.","I do not agree — Neither do I.","He has finished — So have they."],"example":"“The radar is operational.” — “So is the backup unit.”","recall":"Responda com concordância: “I have never sailed abroad.”","tags":["so","neither","auxiliaries"],"q":"A resposta correta a “I do not like delays” é:","correct":"Neither do I.","distractors":["So do I.","Neither am I.","So have I.","I do neither."],"practice":"Identificar primeiro o auxiliar da oração original e depois inverter auxiliar e sujeito.","difficulty":"Intermediário","videos":["v-ason-so-neither"],"prereq":[]}]},{"unit_id":"ason-phys-thermo","prefix":"afx-th","order":10,"lessons":[{"title":"Capacidades térmicas molares, Cp, Cv e relação de Mayer","objective":"Relacionar calor, energia interna e tipo de processo em gases ideais.","summary":"Cv mede a variação de energia interna por mol e por kelvin a volume constante; Cp considera também o trabalho de expansão a pressão constante. Para gás ideal, Cp − Cv = R.","points":["Cv relaciona-se diretamente à energia interna do gás ideal.","Cp é maior que Cv para gás ideal.","γ = Cp/Cv aparece em processos adiabáticos.","Os valores dependem dos graus de liberdade do gás."],"example":"Para um gás ideal monoatômico, Cv = 3R/2 e Cp = 5R/2.","recall":"Por que Cp é maior que Cv em um gás ideal?","tags":["Cp","Cv","Mayer","gases ideais"],"q":"Para um gás ideal, a relação de Mayer é:","correct":"Cp − Cv = R","distractors":["Cp + Cv = R","Cp/Cv = R","Cv − Cp = R","Cp·Cv = R"],"practice":"Separar calor fornecido, variação de energia interna e trabalho realizado pelo gás.","difficulty":"Avançado","videos":["v-ason-gases"],"prereq":[]},{"title":"Transformações adiabáticas e razão γ","objective":"Aplicar relações entre pressão, volume e temperatura sem troca de calor.","summary":"Em processo adiabático ideal, Q = 0. Para transformação reversível de gás ideal, valem relações como PV^γ = constante, com γ = Cp/Cv.","points":["Adiabático não significa temperatura constante.","Expansão adiabática tende a reduzir a temperatura.","Compressão adiabática tende a elevar a temperatura.","A primeira lei conecta trabalho e energia interna."],"example":"Em uma expansão adiabática, o gás realiza trabalho usando sua energia interna.","recall":"Compare transformações isotérmica e adiabática.","tags":["adiabático","gamma","termodinâmica"],"q":"Em uma transformação adiabática ideal:","correct":"não há troca de calor com o ambiente","distractors":["a temperatura é obrigatoriamente constante","o trabalho é sempre zero","a pressão não varia","a energia interna não pode mudar"],"practice":"Começar pela primeira lei e pelo valor Q = 0 antes de aplicar fórmulas específicas.","difficulty":"Avançado","videos":["v-ason-gases"],"prereq":["afx-th-001"]}]},{"unit_id":"ason-math-linear","prefix":"afx-la","order":10,"lessons":[{"title":"Determinantes, posto e invertibilidade","objective":"Relacionar determinante, independência e solução de sistemas.","summary":"O determinante mede uma propriedade algébrica e geométrica de matrizes quadradas. Determinante não nulo implica matriz invertível e posto completo.","points":["Trocar duas linhas muda o sinal do determinante.","Multiplicar uma linha por k multiplica o determinante por k.","Matriz triangular tem determinante igual ao produto da diagonal.","Determinante zero indica singularidade."],"example":"Uma matriz 3×3 com determinante diferente de zero define transformação invertível em R³.","recall":"O que o determinante zero informa sobre uma matriz quadrada?" tes formam uma base.","recall":"Qual é a diferença entre conjunto gerador e base?","tags":["base","dimensão","subespaço"],"q":"Uma base de um espaço vetorial é um conjunto que:","correct":"é linearmente independente e gera o espaço","distractors":["contém todos os vetores do espaço","possui determinante sempre zero","é formado apenas por vetores unitários","não admite combinações lineares"],"practice":"Testar geração e independência separadamente.","difficulty":"Avançado","videos":["v-ma-spaces"],"prereq":["afx-la-002"]},{"title":"Transformações lineares, núcleo e imagem","objective":"Analisar mapeamentos por matriz e teorema posto-nulidade.","summary":"Transformação linear preserva soma e multiplicação escalar. Núcleo contém vetores enviados ao zero; imagem contém resultados possíveis.","points":["Núcleo é solução de T(v)=0.","Imagem é gerada pelas colunas da matriz.","Injetividade relaciona-se a núcleo trivial.","dim(V)=nulidade+posto em dimensão finita."],"example":"Uma transformação com núcleo não trivial não é injetiva.","recall":"Como encontrar o núcleo de uma transformação matricial?","tags":["transformação linear","núcleo","imagem"],"q":"Uma transformação linear é injetiva quando seu núcleo é:","correct":"apenas o vetor zero","distractors":["todo o contradomínio","igual à imagem","formado por todas as colunas","sempre bidimensional"],"practice":"Escrever a matriz na base escolhida e resolver o sistema homogêneo.","difficulty":"Avançado","videos":["v-ma-spaces"],"prereq":["afx-la-003"]},{"title":"Diagonalização e decomposição em autovetores","objective":"Determinar quando uma matriz admite base de autovetores.","summary":"Uma matriz é diagonalizável quando existe uma base composta por autovetores. Nesse caso A = PDP⁻¹, facilitando potências e análise de sistemas.","points":["Autovalores são raízes do polinômio característico.","Autovetores não nulos satisfazem Av=λv.","Multiplicidade geométrica deve ser suficiente.","Autovalores distintos garantem independênc valo com mudança de sinal e converge de forma robusta. Newton usa a tangente xₙ₊₁=xₙ−f(xₙ)/f′(xₙ), mas depende do ponto inicial e da derivada.","points":["Bisseção requer continuidade e mudança de sinal.","Newton pode convergir rapidamente perto da raiz.","Derivada pequena pode causar passos ruins.","Critério de parada pode usar resíduo e variação de x."],"example":"Para função contínua com sinais opostos nas extremidades, a bisseção reduz o intervalo pela metade a cada iteração.","recall":"Quando Newton-Raphson pode falhar?","tags":["bisseção","Newton-Raphson"],"q":"A principal garantia usada pela bisseção é:","correct":"a mudança de sinal em um intervalo de função contínua","distractors":["a existência de matriz inversa","a derivada sempre igual a um","o determinante positivo","a função ser periódica"],"practice":"Verificar hipóteses, ponto inicial, tolerância e número máximo de iterações.","difficulty":"Avançado","videos":["v-ma-num-search"],"prereq":["afx-cn-001"]},{"title":"Sistemas lineares numéricos: Gauss, Jacobi e Gauss-Seidel","objective":"Reconhecer métodos diretos e iterativos.","summary":"Eliminação de Gauss é método direto sujeito a efeitos numéricos e pivotamento. Jacobi e Gauss-Seidel geram aproximações sucessivas e precisam de condições de convergência.","points":["Pivotamento reduz risco de divisões problemáticas.","Jacobi usa valores da iteração anterior.","Gauss-Seidel usa valores novos assim que disponíveis.","Resíduo mede quão bem a aproximação satisfaz Ax=b."],"example":"Em matriz diagonalmente dominante, métodos iterativos frequentemente apresentam boa convergência.","recall":"Qual é a diferença operacional entre Jacobi e Gauss-Seidel?","tags":["Gauss","Jacobi","Gauss-Seidel"],"q":"No método de Gauss-Seidel, os valores recém-calculados são:","correct":"usados imediatamente na mesma iteração","distractors":["descartados até o fim do processo","substituídos por zeros","usados apenas para calcular determinantes","proibidos em sistemas lineares"] let simTimerHandle=null;
function shuffled(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cloneAndShuffleQuestion(q){const pairs=q.options.map((text,i)=>({text,ok:i===q.correct}));const mixed=shuffled(pairs);return {...q,sourceId:q.id,options:mixed.map(x=>x.text),correct:mixed.findIndex(x=>x.ok)}}
function questionsByDiscipline(c,disc){return c.questions.filter(q=>{const l=c.lessons.find(x=>x.id===q.lessonId),u=l&&c.units.find(x=>x.id===l.unitId);return u&&(u.discipline||u.title)===disc})}
function pickQuestions(c,disc,n){return shuffled(questionsByDiscipline(c,disc)).slice(0,n)}
function simPool(type){
 const c=course();

  if(type==='humanas')return [...pickQuestions(c,'Português',10),...pickQuestions(c,'Inglês',10)];
  if(type==='exatas')return [...pickQuestions(c,'Matemática',10),...pickQuestions(c,'Física',10)];
  return [...pickQuestions(c,'Português',10),...pickQuestions(c,'Inglês',10),...pickQuestions(c,'Matemática',10),...pickQuestions(c,'Física',10)];
 }
 if(c.id==='dataprev'){
  if(type==='redes')return pickQuestions(c,'Redes de Computadores',20);
  if(type==='seguranca')return pickQuestions(c,'Segurança da Informação',30);
  if(type==='gerais')return [...pickQuestions(c,'Português',12),...pickQuestions(c,'Inglês',12),...pickQuestions(c,'Raciocínio Lógico',5),...pickQuestions(c,'Atualidades e IA',6),...pickQuestions(c,'Legislação',5)];
  if(type==='especificos')return [...pickQuestions(c,'Redes de Computadores',6),...pickQuestions(c,'Segurança da Informação',16),...pickQuestions(c,'Governança de TI',4),...pickQuestions(c,'Computação em Nuvem',4)];
  if(type==='oficial')return [...pickQuestions(c,'Português',12),...pickQuestions(c,'Inglês',12),...pickQuestions(c,'Raciocínio Lógico',5),...pickQuestions(c,'Atualidades e IA',6),...pickQuestions(c,'Legislação',5),...pickQuestions(c,'Redes de Computadores',6),...pickQuestions(c,'Segurança da Informação',16),...pickQuestions(c,'Governança de TI',4),...pickQuestions(c,'Computação em Nuvem',4)];
 }
 return shuffled(c.questions).slice(0,10)
}
function simDuration(c,type){if(c.id==='ason'&&type==='completo')return 4*60*60;if(c.id==='dataprev'&&type==='oficial')return 4*60*60;if(type==='gerais'||type==='especificos'||type==='humanas'||type==='exatas')return 2*60*60;return 75*60}
function startSim(type){const c=course(),pool=shuffled(simPool(type)).map(cloneAndShuffleQuestion);state.sim={type,pool,index:0,responses:Array(pool.length).fill(null),marked:[],done:false,startedAt:Date.now(),durationSeconds:simDuration(c,type)};render()}
function simDiscipline(c,q){const l=c.lessons.find(x=>x.id===q.lessonId),u=l&&c.units.find(x=>x.id===l.unitId);return u&&(u.discipline||u.title)||'Conteúdo'}
function simWeight(c,q){if(c.id!=='dataprev')return 1;return ['Português','Inglês','Raciocínio Lógico','Atualidades e IA','Legislação'].includes(simDiscipline(c,q))?1:2.5}
function finalizeSim(){if(!state.sim||state.sim.done)return;state.sim.done=true;clearInterval(simTimerHandle);const c=course(),p=progress();let earned=0,max=0,correct=0;state.sim.pool.forEach((q,i)=>{const w=simWeight(c,q);max+=w;if(state.sim.responses[i]===q.correct){earned+=w;correct++}else{const sid=q.sourceId||q.id;if(!p.errors.some(e=>e.questionId===sid))p.errors.push({questionId:sid,lessonId:q.lessonId,date:today(),next:today()})}});const pct=Math.round(earned/max*100);p.simulations.push({type:state.sim.type,score:pct,points:Number(earned.toFixed(1)),maxPoints:Number(max.toFixed(1)),date:today()});saveProgress(p);render()}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${h?String(h).padStart(2,'0')+':':''}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function remainingTime(){if(!state.sim)return 0;return state.sim.durationSeconds-Math.floor((Date.now()-state.sim.startedAt)/1000)}
function simulation(){
 const c=course();
 if(!state.sim){
  const choices=c.id==='ason'?`<button data-sim-start="humanas"><strong>Humanas</strong><small>20 questões · Português + Inglês</small></button><button data-sim-start="exatas"><strong>Exatas</strong><small>20 questões · Matemática + Física</small></button><button data-sim-start="completo"><strong>ASON completo</strong><small>40 questões · 4 horas</small></button>`:`<button data-sim-start="gerais"><strong>Conhecimentos Gerais</strong><small>40 questões · distribuição oficial</small></button><button data-sim-start="especificos"><strong>Conhecimentos Específicos</strong><small>30 questões · distribuição interna balanceada</small></button><button data-sim-start="oficial"><strong>DATAPREV oficial</strong><small>70 questões · pesos 1 e 2,5 · 4 horas</small></button><button data-sim-start="redes"><strong>Redes</strong><small>20 questões</small></button><button data-sim-start="seguranca"><strong>Segurança</strong><small>30 questões</small></button>`;
  const note=c.id==='dataprev'?'<p class="muted">Nos 30 específicos, o edital não fixa quantidade por subtema; a plataforma usa uma distribuição interna balanceada entre Redes, Segurança, Governança e Nuvem.</p>':'';

 }

  return `<section class="diag"><div class="result"><span class="eyebrow">SIMULADO CONCLUÍDO</span><div class="score-circle" style="--score:${pct*3.6}deg"><strong>${pct}%</strong></div><h1>${correct} de ${state.sim.pool.length} questões</h1><p>${c.id==='dataprev'&&state.sim.type==='oficial'?`Pontuação ponderada: <strong>${earned.toFixed(1)} de ${max.toFixed(1)}</strong>.`:''} Em branco: ${blank}.</p><div class="sim-result-grid"><div><span>Acertos</span><strong>${correct}</strong></div><div><span>Erros</span><strong>${state.sim.pool.length-correct-blank}</strong></div><div><span>Em branco</span><strong>${blank}</strong></div><div><span>Marcadas</span><strong>${state.sim.marked.length}</strong></div>${by}</div><button class="primary" id="sim-reset">Novo simulado</button></div></section>`;

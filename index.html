v-pt-interpretacao"]},{"id":"ason-p10","unitId":"ason-port-text","order":5,"title":"Intertextualidade e coerência global","objective":"Reconhecer diálogo entre textos e compatibilidade global de ideias.","duration":11,"summary":"Intertextualidade ocorre quando um texto retoma, transforma, cita ou alude a outro. A coerência global exige que as partes sejam compatíveis com o tema e com o conhecimento mobilizado.","points":["Citação explícita é uma forma de intertextualidade.","Paródia transforma um texto anterior.","Alusão depende do repertório do leitor.","Contradições podem romper a coerência."],"example":"Um anúncio que adapta um verso conhecido cria intertextualidade por alusão.","recall":"Qual é a diferença entre uma simples repetição de palavras e uma relação intertextual?","tags":["intertextualidade","coerência"],"questionIds":["ap019","ap020"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p09"],"videoIds":["v-pt-intertextualidade","v-pt-coesao"]},{"id":"ason-p04","unitId":"ason-port-form","order":1,"title":"Classes de palavras e valores contextuais","objective":"Classificar palavras e interpretar seu emprego no contexto.","duration":11,"summary":"A classe gramatical depende das propriedades e da função da palavra na frase; o valor semântico pode mudar conforme o contexto.","points":["Substantivo nomeia.","Adjetivo caracteriza.","Advérbio modifica verbo, adjetivo ou advérbio.","Preposição relaciona termos.","Conjunção conecta orações ou termos."],"example":"Em “um transporte rápido”, “rápido” é adjetivo; em “o navio avançou rápido”, pode assumir valor adverbial.","recall":"Classifique “mais” em: “O navio não opera mais”.","tags":["morfologia","classes","semântica"],"questionIds":["ap007","ap008"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p03"],"videoIds":["v-pt-classes"]},{"id":"ason-p08","unitId":"ason-port-form","order":2,"title":"Pontuação, ortografia e acentuação","objective":"Aplicar sinais de pontuação e regras do sistema ortográfico.","duration":12,"summary":"Pontuação organiza estruturas sintáticas e produz efeitos de sentido; ortografia e acentuação seguem convenções oficiais.","points":["Não se separa sujeito de verbo por vírgula.","Orações explicativas ficam entre vírgulas.","Vocativo é isolado.","Hiatos e ditongos seguem regras próprias de acentuação.","Dígrafo representa um som por duas letras."],"example":"Em “Candidatos, leiam o comando”, a vírgula isola o vocativo.","recall":"Explique por que não se usa vírgula entre sujeito e predicado.","tags":["pontuação","ortografia","acentuação"],"questionIds":["ap015","ap016"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p07"],"videoIds":["v-pt-acentuacao","v-pt-virgula"]},{"id":"ason-p11","unitId":"ason-port-form","order":3,"title":"Encontros vocálicos, consonantais, dígrafos e dífonos","objective":"Analisar letras, fonemas e encontros previstos no sistema ortográfico.","duration":12,"summary":"A escrita representa sons de modo nem sempre biunívoco. Um dígrafo usa duas letras para um fonema; um dífono ocorre quando uma letra representa dois fonemas.","points":["Ditongo reúne vogal e semivogal na mesma sílaba.","Hiato separa vogais em sílabas diferentes.","Dígrafo consonantal pode ocorrer em “ch”, “lh” e “nh”.","A letra x pode representar dois fonemas, como em “táxi”."],"example":"Em “saída”, as vogais formam hiato; em “pai”, formam ditongo.","recall":"Classifique o encontro vocálico em “saúde” e explique a divisão silábica.","tags":["fonologia","dígrafos","encontros vocálicos"],"questionIds":["ap021","ap022"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p10"],"videoIds":["v-pt-acentuacao"]},{"id":"ason-p12","unitId":"ason-port-form","order":4,"title":"Locuções adjetivas e adverbiais","objective":"Reconhecer grupos de palavras com valor adjetivo ou adverbial.","duration":10,"summary":"Locuções são grupos que desempenham a função de uma classe. Locuções adjetivas caracterizam substantivos; locuções adverbiais indicam circunstâncias.","points":["“De bordo” pode caracterizar um substantivo.","“À noite” indica tempo.","O valor semântico depende do contexto.","Muitas locuções adverbiais femininas recebem crase."],"example":"Em “equipe de bordo”, “de bordo” caracteriza “equipe”; em “chegou de bordo”, a análise depende do sentido contextual.","recall":"Crie uma locução adverbial de modo e outra de tempo.","tags":["locuções","semântica"],"questionIds":["ap023","ap024"],"difficulty":"Básico","video":null,"discipline":"Português","prerequisites":["ason-p11"],"videoIds":["v-pt-classes"]},{"id":"ason-p05","unitId":"ason-port-syntax","order":1,"title":"Estrutura sintática da oração","objective":"Identificar termos essenciais, integrantes e acessórios.","duration":12,"summary":"A análise sintática descreve as relações entre os termos de uma oração.","points":["Sujeito é o termo sobre o qual se declara algo.","Predicado contém a declaração sobre o sujeito.","Objetos completam verbos.","Predicativo atribui característica.","Adjuntos acrescentam circunstâncias ou especificações."],"example":"Em “Os candidatos permaneceram atentos”, “atentos” é predicativo do sujeito.","recall":"Qual é a função de “a prova” em “O candidato resolveu a prova”?","tags":["sintaxe","sujeito","predicado"],"questionIds":["ap009","ap010"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p04"],"videoIds":["v-pt-sintaxe"]},{"id":"ason-p13","unitId":"ason-port-syntax","order":2,"title":"Ordem dos termos, aposto e vocativo","objective":"Analisar deslocamentos, explicações e chamamentos na frase.","duration":11,"summary":"A ordem direta tende a ser sujeito, verbo e complementos. Termos deslocados podem exigir pontuação. O aposto explica ou especifica; o vocativo chama o interlocutor.","points":["Vocativo não integra sujeito ou predicado.","Aposto pode ser explicativo, enumerativo ou especificativo.","Deslocamentos alteram ênfase.","A pontuação ajuda a marcar a estrutura."],"example":"“Candidatos, leiam o edital” contém vocativo; “O CIAGA, centro de instrução, divulgou o aviso” contém aposto explicativo.","recall":"Identifique a diferença sintática entre “Comandante, venha” e “O comandante veio”.","tags":["ordem dos termos","aposto","vocativo"],"questionIds":["ap025","ap026"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p12"],"videoIds":["v-pt-sintaxe"]},{"id":"ason-p14","unitId":"ason-port-syntax","order":3,"title":"Colocação pronominal","objective":"Aplicar próclise, ênclise e mesóclise em contextos formais.","duration":12,"summary":"A posição dos pronomes átonos depende de fatores sintáticos e estilísticos. Palavras atrativas favorecem próclise; início de frase formal favorece ênclise.","points":["Negação atrai o pronome: “não se informou”.","Pronomes relativos atraem próclise.","Ênclise é comum com verbo iniciando oração formal.","Mesóclise ocorre com futuro sem palavra atrativa."],"example":"“Nunca me disseram” usa próclise por causa do advérbio negativo.","recall":"Reescreva “Me informaram o resultado” segundo a norma formal em início de frase.","tags":["colocação pronominal","próclise"],"questionIds":["ap027","ap028"],"difficulty":"Avançado","video":null,"discipline":"Português","prerequisites":["ason-p13"],"videoIds":["v-pt-colocacao"]},{"id":"ason-p06","unitId":"ason-port-norm","order":1,"title":"Concordância e regência","objective":"Aplicar relações de concordância e complementação.","duration":12,"summary":"Concordância ajusta formas nominais e verbais; regência determina as preposições exigidas por nomes e verbos.","points":["O verbo concorda com o núcleo do sujeito.","Adjetivos concordam com substantivos.","Assistir, no sentido de ver, rege “a”.","Preferir pede estrutura “preferir X a Y”."],"example":"“Os resultados foram divulgados” mantém o verbo no plural por concordar com “resultados”.","recall":"Complete: “O candidato assistiu ___ aula”.","tags":["concordância","regência"],"questionIds":["ap011","ap012"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p05"],"videoIds":["v-pt-concordancia","v-pt-regencia"]},{"id":"ason-p07","unitId":"ason-port-norm","order":2,"title":"Crase","objective":"Reconhecer a fusão da preposição “a” com o artigo ou pronome.","duration":10,"summary":"A crase ocorre quando um termo exige preposição “a” e o termo seguinte admite artigo feminino “a/as” ou pronome iniciado por “a”.","points":["Troque o termo feminino por masculino para testar “ao”.","Não há crase antes de verbo.","Locuções adverbiais femininas frequentemente recebem crase.","Antes de palavras masculinas, em regra, não há crase."],"example":"“Dirigi-me à sala” equivale a “dirigi-me ao local”.","recall":"Por que há crase em “à noite”?","tags":["crase","regência"],"questionIds":["ap013","ap014"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p06"],"videoIds":["v-pt-crase"]},{"id":"ason-p15","unitId":"ason-port-norm","order":3,"title":"Articuladores sintáticos e relações lógicas","objective":"Interpretar causa, consequência, condição, concessão, finalidade e oposição.","duration":11,"summary":"Articuladores conectam ideias e orientam a interpretação. Trocar um conector pode preservar a estrutura gramatical e alterar completamente o sentido.","points":["“Porque” pode introduzir causa.","“Embora” introduz concessão.","“Se” pode marcar condição.","“Portanto” introduz conclusão."],"example":"“Embora chovesse, o navio partiu” apresenta um fato contrário à expectativa.","recall":"Qual relação é expressa por “a fim de que” e por “desde que”?","tags":["articuladores","relações semânticas"],"questionIds":["ap029","ap030"],"difficulty":"Intermediário","video":null,"discipline":"Português","prerequisites":["ason-p14"],"videoIds":["v-pt-coesao","v-pt-virgula"]},{"id":"ason-e01","unitId":"ason-eng-read","order":1,"title":"Reading strategies","objective":"Localizar ideias principais e informações específicas.","duration":9,"summary":"As provas exigem leitura orientada: primeiro identifique o comando, depois procure evidências no texto.","points":["Skimming busca a visão geral.","Scanning procura informação específica.","Palavras-chave conectam pergunta e texto.","A resposta deve ser apoiada pelo trecho."],"example":"Para descobrir onde ocorreu um acidente, procure nomes de lugares e preposições espaciais antes de traduzir o texto inteiro.","recall":"What is the difference between skimming and scanning?","tags":["reading","skimming","scanning"],"questionIds":["ae001","ae002"],"difficulty":"Básico","video":null,"discipline":"Inglês","prerequisites":[],"videoIds":["v-en-reading-search"]},{"id":"ason-e02","unitId":"ason-eng-read","order":2,"title":"Vocabulary in context and false cognates","objective":"Inferir sentidos e evitar traduções enganosas.","duration":10,"summary":"Context clues, word formation and semantic relations help determine vocabulary without translating every word.","points":["Cognates resemble Portuguese words and share meaning.","False cognates look familiar but mean something different.","Prefixes and suffixes reveal function and sense.","The surrounding sentence restricts possible meanings."],"example":"“Actually” usually means “na verdade”, not “atualmente”.","recall":"Give one example of a false cognate.","tags":["vocabulary","false cognates"],"questionIds":["ae003","ae004"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e01"],"videoIds":["v-en-reading-search"]},{"id":"ason-e14","unitId":"ason-eng-read","order":3,"title":"Semantic equivalence, opposition and idioms","objective":"Reconhecer sinônimos, antônimos e expressões não literais.","duration":11,"summary":"Reading questions often ask for equivalent meaning. Idioms cannot always be understood by translating each word separately.","points":["Synonyms are context-dependent.","Antonyms express opposition.","Phrasal and idiomatic meaning may differ from literal meaning.","Paraphrase preserves core meaning."],"example":"“Make headway” means to make progress, not to move one’s head.","recall":"Give a contextual synonym for “halt” in a port-operations text.","tags":["synonyms","idioms","paraphrase"],"questionIds":["ae027","ae028"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e13"],"videoIds":["v-en-phrasal","v-en-reading-search"]},{"id":"ason-e15","unitId":"ason-eng-read","order":4,"title":"Maritime texts, notices and public signs","objective":"Compreender vocabulário funcional de segurança e navegação.","duration":12,"summary":"Public notices use concise language, imperatives and fixed vocabulary. Maritime texts often combine technical terms with general reading skills.","points":["Keep clear means do not obstruct.","No smoking expresses prohibition.","Crew refers to people working aboard.","Cargo is goods transported."],"example":"“Restricted area — authorized personnel only” limits access to authorized staff.","recall":"What should a candidate infer from the sign “Life jackets must be worn”?","tags":["maritime English","public notices"],"questionIds":["ae029","ae030"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e14"],"videoIds":["v-en-reading-search"]},{"id":"ason-e03","unitId":"ason-eng-verbs","order":1,"title":"Verb tenses and sentence forms","objective":"Reconhecer tempos verbais e formas afirmativa, negativa e interrogativa.","duration":12,"summary":"Verb tenses locate actions in time and show duration, completion or habituality.","points":["Simple present expresses facts and routines.","Present continuous emphasizes ongoing actions.","Simple past describes completed past events.","Present perfect connects past and present.","Auxiliaries form negatives and questions."],"example":"“The ship has arrived” emphasizes a completed event with present relevance.","recall":"Change “They inspected the vessel” into a question.","tags":["verbs","tenses","auxiliaries"],"questionIds":["ae005","ae006"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e02"],"videoIds":["v-en-present-simple","v-en-present-perfect"]},{"id":"ason-e04","unitId":"ason-eng-verbs","order":2,"title":"Auxiliaries and modal verbs","objective":"Interpretar obrigação, necessidade, possibilidade e conclusão.","duration":11,"summary":"Modal verbs modify the meaning of the main verb and do not receive “to” before the infinitive.","points":["Must can express obligation or strong conclusion.","Must not expresses prohibition.","Have to expresses external necessity.","May and might express possibility.","Should expresses advice."],"example":"“All crew members must wear PPE” expresses obligation.","recall":"What is the difference between “must not” and “do not have to”?","tags":["modals","auxiliaries"],"questionIds":["ae007","ae008"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e03"],"videoIds":["v-en-modals"]},{"id":"ason-e09","unitId":"ason-eng-verbs","order":3,"title":"Regular, irregular, stative and dynamic verbs","objective":"Distinguir formas verbais e restrições de aspecto contínuo.","duration":11,"summary":"Regular verbs form the past with -ed; irregular verbs change differently. Stative verbs describe states and are usually avoided in progressive forms.","points":["Work → worked is regular.","Go → went is irregular.","Know and believe are commonly stative.","Run and operate are dynamic."],"example":"“I know the route” is normally preferred to “I am knowing the route”.","recall":"Why is “She is owning the vessel” usually inappropriate?","tags":["regular verbs","stative verbs"],"questionIds":["ae017","ae018"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e08"],"videoIds":["v-en-present-simple","v-en-present-cont"]},{"id":"ason-e10","unitId":"ason-eng-verbs","order":4,"title":"Imperatives and wh-questions","objective":"Interpretar comandos e formar perguntas com pronomes interrogativos.","duration":10,"summary":"Imperatives use the base form of the verb and often omit the subject. Wh-questions use interrogative words to request specific information.","points":["Open the valve is an imperative.","Do not enter is a negative imperative.","Where asks about place.","Why asks about reason."],"example":"“Wear your life jacket” is a direct instruction.","recall":"Form a question asking the time of departure.","tags":["imperative","wh-questions"],"questionIds":["ae019","ae020"],"difficulty":"Básico","video":null,"discipline":"Inglês","prerequisites":["ason-e09"],"videoIds":["v-en-present-simple"]},{"id":"ason-e05","unitId":"ason-eng-patterns","order":1,"title":"Conditionals, infinitive and gerund","objective":"Distinguir estruturas condicionais e complementos verbais.","duration":12,"summary":"Conditional sentences connect a condition to a result; infinitives and gerunds may follow verbs and adjectives.","points":["Zero conditional states general truths.","First conditional refers to a real future possibility.","Second conditional is hypothetical.","Third conditional refers to an unreal past.","Some verbs require gerund or infinitive."],"example":"“If the weather improves, the ship will depart” is a first conditional.","recall":"Complete: “If I had more time, I ___ study more.”","tags":["conditionals","gerund","infinitive"],"questionIds":["ae009","ae010"],"difficulty":"Avançado","video":null,"discipline":"Inglês","prerequisites":["ason-e04"],"videoIds":["v-en-grammar-search"]},{"id":"ason-e06","unitId":"ason-eng-patterns","order":2,"title":"Active/passive voice and reported speech","objective":"Reconhecer mudança de foco e relato indireto.","duration":12,"summary":"The passive voice emphasizes the receiver of an action; reported speech reproduces statements with necessary adjustments.","points":["Passive: form of “be” + past participle.","The agent may be omitted.","Tense must be preserved appropriately.","Reported speech may shift pronouns and time references."],"example":"“The report was submitted by the officer” focuses on the report.","recall":"Change “They repaired the engine” into the passive voice.","tags":["passive voice","reported speech"],"questionIds":["ae011","ae012"],"difficulty":"Avançado","video":null,"discipline":"Inglês","prerequisites":["ason-e05"],"videoIds":["v-en-passive","v-en-grammar-search"]},{"id":"ason-e11","unitId":"ason-eng-patterns","order":3,"title":"Causative have/get and verb patterns","objective":"Reconhecer estruturas causativas e verbos seguidos de infinitivo ou objeto.","duration":12,"summary":"Causative structures show that someone arranges for another person to perform an action. Verb patterns determine whether an infinitive, gerund or object follows.","points":["Have/get something done expresses arranged service.","Ask someone to do uses object + infinitive.","Make someone do omits “to”.","Some verbs select gerund or infinitive."],"example":"“The captain had the radar repaired” means another person performed the repair.","recall":"Explain the difference between “I repaired it” and “I had it repaired”.","tags":["causative","verb patterns"],"questionIds":["ae021","ae022"],"difficulty":"Avançado","video":null,"discipline":"Inglês","prerequisites":["ason-e10"],"videoIds":["v-en-grammar-search"]},{"id":"ason-e07","unitId":"ason-eng-structure","order":1,"title":"Prepositions, conjunctions and phrasal verbs","objective":"Interpretar relações e combinações fixas.","duration":11,"summary":"Prepositions and conjunctions establish time, place, cause, contrast and other relations; phrasal verbs form lexical units.","points":["Despite is followed by a noun or gerund.","Although introduces a clause.","Because introduces a cause.","Take over can mean assume control.","Look for means search."],"example":"“Despite the storm, the vessel continued” expresses contrast.","recall":"What does “take over” mean in “The agency took over the investigation”?","tags":["prepositions","connectors","phrasal verbs"],"questionIds":["ae013","ae014"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e06"],"videoIds":["v-en-phrasal"]},{"id":"ason-e08","unitId":"ason-eng-structure","order":2,"title":"Word formation, syntax and public notices","objective":"Usar prefixos, sufixos e ordem sintática para compreender textos e placas.","duration":11,"summary":"Word formation helps infer meaning and class; public notices use concise conventional language.","points":["-tion commonly forms nouns.","-ly commonly forms adverbs.","Un- often expresses negation.","English usually follows subject–verb–object order.","“No entry” means entry is prohibited."],"example":"“Careful” is an adjective; “carefully” is an adverb.","recall":"What does the notice “Authorized personnel only” mean?","tags":["word formation","syntax","notices"],"questionIds":["ae015","ae016"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e07"],"videoIds":["v-en-reading-search"]},{"id":"ason-e12","unitId":"ason-eng-structure","order":3,"title":"Nouns, determiners, articles and pronouns","objective":"Reconhecer referência, quantidade e definitude em sintagmas nominais.","duration":12,"summary":"Nouns are organized by determiners, articles and pronouns. These elements indicate specificity, quantity, possession and reference.","points":["A/an introduces a non-specific singular count noun.","The marks identifiable reference.","Much is used with uncountable nouns.","Many is used with plural count nouns."],"example":"“The vessel” refers to a vessel already identifiable in the context.","recall":"Choose between much and many for “___ equipment” and explain.","tags":["articles","determiners","pronouns"],"questionIds":["ae023","ae024"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e11"],"videoIds":["v-en-present-simple"]},{"id":"ason-e13","unitId":"ason-eng-structure","order":4,"title":"Adjectives, adverbs and word order","objective":"Aplicar modificadores e a ordem básica dos componentes sintáticos.","duration":11,"summary":"Adjectives usually modify nouns; adverbs modify verbs, adjectives or other adverbs. English word order is less flexible than Portuguese.","points":["Adjectives usually precede nouns.","Adverbs of frequency often precede the main verb.","Manner adverbs commonly follow the verb or object.","Subject–verb–object is the basic order."],"example":"“The crew carefully inspected the engine” places the manner adverb before the main verb.","recall":"Reorder: “regularly / the officer / checks / the equipment”.","tags":["adjectives","adverbs","word order"],"questionIds":["ae025","ae026"],"difficulty":"Intermediário","video":null,"discipline":"Inglês","prerequisites":["ason-e12"],"videoIds":["v-en-present-cont"]},{"id":"ason-m01","unitId":"ason-math-calc1","order":1,"title":"Funções e representação gráfica","objective":"Determinar domínio, imagem e comportamento de funções.","duration":12,"summary":"Funções associam elementos do domínio a um único valor no contradomínio e podem ser analisadas por fórmulas, tabelas e gráficos.","points":["Verifique restrições de denominadores e raízes.","Zeros são pontos onde f(x)=0.","Composição substitui uma função dentro de outra.","Função inversa desfaz a transformação quando existe."],"example":"Para f(x)=1/(x−2), o domínio exclui x=2.","recall":"Qual é o domínio de √(x−3)?","tags":["funções","domínio","gráficos"],"questionIds":["am001","am002"],"difficulty":"Básico","video":null,"discipline":"Matemática","prerequisites":[],"videoIds":["v-ma-calc-playlist"]},{"id":"ason-m02","unitId":"ason-math-calc1","order":2,"title":"Limites e continuidade","objective":"Calcular limites e verificar continuidade.","duration":13,"summary":"O limite descreve o comportamento de uma função quando a variável se aproxima de um ponto.","points":["Substituição direta funciona quando não há indeterminação.","Fatoração pode eliminar 0/0.","Limites laterais devem coincidir.","Continuidade exige limite igual ao valor da função."],"example":"lim(x→2)(x²−4)/(x−2)=lim(x→2)(x+2)=4.","recall":"Quais condições definem continuidade em x=a?","tags":["limites","continuidade"],"questionIds":["am003","am004"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m01"],"videoIds":["v-ma-calc-playlist"]},{"id":"ason-m03","unitId":"ason-math-calc1","order":3,"title":"Derivadas e regras de derivação","objective":"Interpretar taxa de variação e calcular derivadas.","duration":14,"summary":"A derivada mede a taxa instantânea de variação e a inclinação da reta tangente.","points":["Regra da potência: d(xⁿ)/dx=nxⁿ⁻¹.","Produto e quociente possuem regras próprias.","A regra da cadeia deriva composições.","Derivada zero identifica candidatos a extremos."],"example":"Para f(x)=x³, f′(x)=3x².","recall":"Derive f(x)=sen(2x).","tags":["derivadas","regras"],"questionIds":["am005","am006"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m02"],"videoIds":["v-ma-derivadas"]},{"id":"ason-m04","unitId":"ason-math-calc1","order":4,"title":"Aplicações de derivação e otimização","objective":"Usar derivadas para máximos, mínimos e taxas relacionadas.","duration":15,"summary":"Pontos críticos e análise de sinal permitem estudar crescimento, decrescimento e extremos.","points":["Resolva f′(x)=0 ou pontos onde f′ não existe.","Use a segunda derivada ou mudança de sinal.","Em regiões fechadas, compare fronteira e pontos críticos.","Modele a grandeza antes de derivar."],"example":"Para maximizar uma área, escreva a área em uma variável, derive e verifique o ponto crítico.","recall":"Qual é a diferença entre ponto crítico e máximo?","tags":["otimização","máximos","mínimos"],"questionIds":["am007","am008"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m03"],"videoIds":["v-ma-derivadas"]},{"id":"ason-m05","unitId":"ason-math-int","order":1,"title":"Integração e Teorema Fundamental","objective":"Calcular integrais e relacioná-las a áreas e antiderivadas.","duration":14,"summary":"A integral definida acumula quantidades; o Teorema Fundamental conecta derivação e integração.","points":["Integral indefinida representa família de primitivas.","Integral definida produz um número.","Área algébrica pode ter sinais.","O Teorema Fundamental usa uma antiderivada nos limites."],"example":"∫₀² x dx=[x²/2]₀²=2.","recall":"Qual é uma primitiva de 3x²?","tags":["integração","teorema fundamental"],"questionIds":["am009","am010"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m04"],"videoIds":["v-ma-tfc"]},{"id":"ason-m06","unitId":"ason-math-int","order":2,"title":"Técnicas e aplicações de integração","objective":"Escolher substituição, partes e métodos geométricos.","duration":15,"summary":"A forma do integrando orienta a técnica adequada.","points":["Substituição desfaz a regra da cadeia.","Integração por partes deriva do produto.","Discos e anéis calculam volumes de revolução.","Coordenadas polares simplificam regiões circulares."],"example":"Em ∫2x cos(x²)dx, use u=x².","recall":"Quando a integração por partes é especialmente útil?","tags":["técnicas de integração","volumes"],"questionIds":["am011","am012"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m05"],"videoIds":["v-ma-partes","v-ma-aplic-integral"]},{"id":"ason-m09","unitId":"ason-math-int","order":3,"title":"Coordenadas polares e equações paramétricas","objective":"Representar curvas e calcular grandezas em sistemas alternativos.","duration":13,"summary":"Equações paramétricas descrevem coordenadas por meio de um parâmetro. Coordenadas polares usam distância ao polo e ângulo.","points":["x=r cosθ e y=r sinθ.","Curvas podem ser descritas por x(t), y(t).","A área polar usa 1/2∫r²dθ.","A inclinação paramétrica envolve dy/dt dividido por dx/dt."],"example":"A circunferência de raio a pode ser parametrizada por x=a cos t e y=a sin t.","recall":"Converta o ponto polar (2, π/2) para coordenadas cartesianas.","tags":["polares","paramétricas"],"questionIds":["am017","am018"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m08"],"videoIds":["v-ma-calc-playlist"]},{"id":"ason-m10","unitId":"ason-math-multi","order":1,"title":"Funções vetoriais e derivadas parciais","objective":"Analisar trajetórias e taxas de variação em várias variáveis.","duration":14,"summary":"Funções vetoriais descrevem curvas no espaço. Derivadas parciais medem a variação em uma direção coordenada mantendo as demais variáveis fixas.","points":["r(t) pode representar posição.","r′(t) representa velocidade.","∂f/∂x mantém y constante.","O gradiente reúne derivadas parciais."],"example":"Para f(x,y)=x²y, ∂f/∂x=2xy.","recall":"Qual é a interpretação geométrica do vetor velocidade r′(t)?","tags":["funções vetoriais","derivadas parciais"],"questionIds":["am019","am020"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m09"],"videoIds":["v-ma-multi-search"]},{"id":"ason-m11","unitId":"ason-math-multi","order":2,"title":"Integrais duplas e triplas","objective":"Montar integrais sobre regiões planas e espaciais.","duration":15,"summary":"Integrais múltiplas acumulam grandezas em áreas e volumes. Os limites devem descrever corretamente a região.","points":["∬1 dA fornece área.","∭1 dV fornece volume.","A ordem de integração pode ser alterada com novos limites.","Simetria pode simplificar cálculos."],"example":"A massa de uma lâmina de densidade ρ(x,y) é ∬D ρ dA.","recall":"O que representa ∭V ρ(x,y,z)dV?","tags":["integrais múltiplas","volume"],"questionIds":["am021","am022"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m10"],"videoIds":["v-ma-multi-search"]},{"id":"ason-m08","unitId":"ason-math-series","order":1,"title":"Séries, equações diferenciais e Cálculo Numérico","objective":"Reconhecer métodos avançados do programa oficial.","duration":16,"summary":"O edital também inclui sequências, séries, equações diferenciais e aproximações numéricas.","points":["Séries estudam somas infinitas.","Série de Taylor aproxima funções por polinômios.","Equações diferenciais relacionam funções e derivadas.","Métodos numéricos aproximam zeros, integrais e soluções lineares.","Erros de arredondamento e truncamento devem ser controlados."],"example":"O método da bisseção aproxima uma raiz mantendo um intervalo com mudança de sinal.","recall":"Qual é a finalidade de uma série de Taylor?","tags":["séries","EDO","cálculo numérico"],"questionIds":["am015","am016"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m07"],"videoIds":["v-ma-series-search","v-ma-num-search"]},{"id":"ason-m12","unitId":"ason-math-series","order":2,"title":"Sequências, séries numéricas e convergência","objective":"Distinguir termos, somas parciais e comportamento limite.","duration":13,"summary":"Uma sequência é uma lista ordenada; uma série é a soma dos termos de uma sequência. Convergência exige que as somas parciais se aproximem de um valor finito.","points":["an descreve uma sequência.","Σan descreve uma série.","Série geométrica converge quando |r|<1.","Termos não tendendo a zero implicam divergência."],"example":"A série 1+1/2+1/4+… converge para 2.","recall":"Por que a condição an→0 é necessária, mas não suficiente, para a série convergir?","tags":["sequências","séries"],"questionIds":["am023","am024"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m11"],"videoIds":["v-ma-series-search"]},{"id":"ason-m13","unitId":"ason-math-series","order":3,"title":"Séries de potência, Taylor e Fourier","objective":"Representar funções por expansões locais ou periódicas.","duration":15,"summary":"Séries de potência generalizam polinômios infinitos. Taylor usa derivadas em um ponto; Fourier decompõe funções periódicas em senos e cossenos.","points":["Taylor aproxima localmente.","Maclaurin é Taylor em zero.","Fourier representa componentes harmônicas.","Convergência depende de hipóteses e intervalo."],"example":"eˣ=1+x+x²/2!+… é a série de Maclaurin da exponencial.","recall":"Qual é a principal diferença entre uma série de Taylor e uma série de Fourier?","tags":["Taylor","Fourier","série de potência"],"questionIds":["am025","am026"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m12"],"videoIds":["v-ma-series-search"]},{"id":"ason-m14","unitId":"ason-math-series","order":4,"title":"Equações diferenciais ordinárias","objective":"Resolver relações entre funções e suas derivadas.","duration":14,"summary":"Equações diferenciais modelam evolução. A solução é uma função que satisfaz a equação e, quando dado, o valor inicial.","points":["y′=ky modela crescimento ou decaimento exponencial.","Separação de variáveis resolve várias EDOs de primeira ordem.","Condições iniciais determinam constantes.","A ordem é a maior derivada presente."],"example":"A solução geral de y′=ky é y=Ce^(kt).","recall":"Qual informação adicional transforma uma solução geral em solução particular?","tags":["equações diferenciais","condição inicial"],"questionIds":["am027","am028"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m13"],"videoIds":["v-ma-edo-search"]},{"id":"ason-m07","unitId":"ason-math-linear","order":1,"title":"Vetores, matrizes e Álgebra Linear","objective":"Operar no R²/R³ e reconhecer estruturas lineares.","duration":15,"summary":"Álgebra Linear estuda vetores, espaços, matrizes e transformações.","points":["Produto escalar mede alinhamento e ortogonalidade.","Produto vetorial gera vetor perpendicular no R³.","Determinante indica invertibilidade.","Autovetores preservam direção sob uma transformação.","Sistemas lineares podem ser resolvidos por eliminação."],"example":"Vetores u e v são ortogonais quando u·v=0.","recall":"Qual é a interpretação geométrica do produto vetorial?","tags":["álgebra linear","vetores","matrizes"],"questionIds":["am013","am014"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m06"],"videoIds":["v-ma-linear-intro","v-ma-spaces"]},{"id":"ason-m15","unitId":"ason-math-linear","order":2,"title":"Transformações lineares","objective":"Verificar linearidade e interpretar núcleo e imagem.","duration":13,"summary":"Uma transformação é linear quando preserva soma e multiplicação por escalar. Núcleo e imagem descrevem perda e alcance de informação.","points":["T(u+v)=T(u)+T(v).","T(αu)=αT(u).","O núcleo contém vetores enviados a zero.","A imagem contém resultados possíveis."],"example":"A rotação em torno da origem é uma transformação linear; uma translação não é.","recall":"Por que uma transformação linear sempre envia o vetor zero ao vetor zero?","tags":["transformações lineares","núcleo","imagem"],"questionIds":["am029","am030"],"difficulty":"Intermediário","video":null,"discipline":"Matemática","prerequisites":["ason-m14"],"videoIds":["v-ma-spaces"]},{"id":"ason-m16","unitId":"ason-math-linear","order":3,"title":"Autovalores, autovetores e sistemas lineares","objective":"Relacionar direções invariantes, matrizes e resolução de sistemas.","duration":15,"summary":"Autovetores mantêm sua direção sob uma transformação, mudando apenas por um fator. Sistemas lineares podem ter solução única, infinitas ou nenhuma.","points":["Av=λv define autovalor e autovetor.","det(A−λI)=0 fornece autovalores.","Matriz invertível produz solução única para Ax=b.","Escalonamento revela compatibilidade."],"example":"Se Av=3v, então v é autovetor associado a λ=3.","recall":"O que o determinante não nulo indica sobre um sistema quadrado?","tags":["autovalores","sistemas lineares"],"questionIds":["am031","am032"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m15"],"videoIds":["v-ma-eigen","v-ma-eigen-app"]},{"id":"ason-m17","unitId":"ason-math-num","order":1,"title":"Erros numéricos e zeros de funções","objective":"Quantificar aproximações e aplicar métodos de busca de raízes.","duration":14,"summary":"Cálculo numérico trabalha com aproximações. Erros absoluto e relativo medem qualidade; bisseção e Newton aproximam zeros de funções.","points":["Erro absoluto é |valor exato−aproximação|.","Erro relativo normaliza pelo valor exato.","Bisseção exige mudança de sinal em intervalo contínuo.","Newton usa derivada e chute inicial."],"example":"Para aproximar √2, pode-se resolver f(x)=x²−2=0.","recall":"Qual vantagem de robustez a bisseção possui em relação ao método de Newton?","tags":["erros","raízes numéricas"],"questionIds":["am033","am034"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m16"],"videoIds":["v-ma-num-search"]},{"id":"ason-m18","unitId":"ason-math-num","order":2,"title":"Sistemas, interpolação e integração numérica","objective":"Aproximar soluções, funções e áreas por algoritmos discretos.","duration":15,"summary":"Métodos numéricos resolvem sistemas, constroem polinômios interpoladores e aproximam integrais quando soluções exatas são difíceis.","points":["Eliminação de Gauss resolve sistemas lineares.","Interpolação passa pelos dados fornecidos.","Regra do trapézio aproxima área por trapézios.","Refinamento de malha tende a reduzir erro."],"example":"Com dois pontos, a interpolação linear usa a reta que passa por ambos.","recall":"Qual é a diferença entre interpolar dados e ajustar uma regressão?","tags":["interpolação","integração numérica"],"questionIds":["am035","am036"],"difficulty":"Avançado","video":null,"discipline":"Matemática","prerequisites":["ason-m17"],"videoIds":["v-ma-interp-linear","v-ma-interp-poly"]},{"id":"ason-f01","unitId":"ason-phys-mech","order":1,"title":"Vetores e Leis de Newton","objective":"Decompor forças e aplicar as leis do movimento.","duration":13,"summary":"A dinâmica relaciona forças à aceleração por meio de grandezas vetoriais.","points":["A resultante é soma vetorial das forças.","Primeira lei descreve equilíbrio inercial.","Segunda lei: ΣF=ma.","Ação e reação atuam em corpos diferentes."],"example":"Uma força de 10 N em um corpo de 2 kg, sem outras forças, produz aceleração de 5 m/s².","recall":"Por que ação e reação não se anulam diretamente?","tags":["mecânica","Newton","vetores"],"questionIds":["af001","af002"],"difficulty":"Básico","video":null,"discipline":"Física","prerequisites":[],"videoIds":["v-fi-newton"]},{"id":"ason-f02","unitId":"ason-phys-mech","order":2,"title":"Trabalho e energia","objective":"Aplicar conservação de energia e relação trabalho–energia.","duration":13,"summary":"Trabalho transfere energia quando uma força atua ao longo de um deslocamento.","points":["W=F·d·cosθ para força constante.","Energia cinética é mv²/2.","Forças conservativas possuem energia potencial.","Sem dissipação, a energia mecânica se conserva."],"example":"Na queda livre sem resistência do ar, energia potencial gravitacional transforma-se em cinética.","recall":"O que diz o teorema trabalho–energia?","tags":["energia","trabalho"],"questionIds":["af003","af004"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f01"],"videoIds":["v-fi-newton"]},{"id":"ason-f03","unitId":"ason-phys-mech","order":3,"title":"Estática do corpo rígido e torque","objective":"Resolver equilíbrio de forças e momentos.","duration":14,"summary":"Um corpo rígido está em equilíbrio quando a resultante das forças e a resultante dos torques são nulas.","points":["ΣF=0 garante equilíbrio translacional.","Στ=0 garante equilíbrio rotacional.","Torque depende do braço perpendicular.","Escolher o ponto de cálculo pode eliminar forças desconhecidas."],"example":"Uma força aplicada mais longe do eixo produz maior torque para o mesmo módulo.","recall":"Quais duas condições caracterizam equilíbrio estático?","tags":["estática","torque"],"questionIds":["af005","af006"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f02"],"videoIds":["v-fi-newton"]},{"id":"ason-f04","unitId":"ason-phys-wave","order":1,"title":"Oscilações, superposição e ondas","objective":"Interpretar movimento harmônico e propagação de ondas.","duration":14,"summary":"O programa inclui oscilações harmônicas, amortecimento, ressonância, ondas transversais, interferência, som e Doppler.","points":["No MHS, a força restauradora é proporcional ao deslocamento.","Superposição soma deslocamentos.","Ressonância amplia resposta próxima à frequência natural.","Ondas transportam energia sem transporte líquido permanente de matéria.","Doppler altera frequência observada por movimento relativo."],"example":"Duas ondas de mesma frequência podem produzir interferência construtiva ou destrutiva.","recall":"O que ocorre quando a frequência externa se aproxima da natural?","tags":["ondas","MHS","Doppler"],"questionIds":["af007","af008"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f03"],"videoIds":["v-fi-osc"]},{"id":"ason-f09","unitId":"ason-phys-wave","order":2,"title":"Oscilações amortecidas, forçadas e ressonância","objective":"Comparar perda de energia, força externa e resposta em frequência.","duration":13,"summary":"Amortecimento reduz a amplitude. Uma força periódica sustenta a oscilação; próximo à frequência natural pode ocorrer ressonância.","points":["Amortecimento dissipa energia.","Oscilação forçada responde à frequência externa.","Ressonância aumenta a amplitude.","A largura do pico depende do amortecimento."],"example":"Um balanço empurrado periodicamente no ritmo correto recebe energia com eficiência.","recall":"Como o aumento do amortecimento altera o pico de ressonância?","tags":["oscilações forçadas","ressonância"],"questionIds":["af017","af018"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f08"],"videoIds":["v-fi-osc"]},{"id":"ason-f10","unitId":"ason-phys-wave","order":3,"title":"Som, intensidade, batimentos e efeito Doppler","objective":"Calcular e interpretar fenômenos acústicos.","duration":14,"summary":"Som é uma onda mecânica. Intensidade mede potência por área; nível sonoro usa escala logarítmica. Batimentos surgem de frequências próximas, e Doppler de movimento relativo.","points":["I=P/A.","Nível sonoro usa 10 log(I/I₀).","Frequência de batimento é |f1−f2|.","A aproximação entre fonte e observador aumenta a frequência percebida."],"example":"Duas fontes de 440 Hz e 444 Hz produzem 4 batimentos por segundo.","recall":"O que acontece com o tom de uma sirene quando ela se aproxima do observador?","tags":["acústica","Doppler","batimentos"],"questionIds":["af019","af020"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f09"],"videoIds":["v-fi-doppler"]},{"id":"ason-f05","unitId":"ason-phys-fluid","order":1,"title":"Mecânica dos fluidos","objective":"Aplicar pressão, Arquimedes, continuidade e Bernoulli.","duration":15,"summary":"Fluidos em repouso e movimento são descritos por grandezas como pressão, densidade e viscosidade.","points":["Pressão hidrostática cresce com profundidade.","Empuxo equivale ao peso do fluido deslocado.","Continuidade conserva vazão em fluido incompressível.","Bernoulli relaciona pressão, velocidade e altura em escoamento ideal."],"example":"Em um tubo que se estreita, a velocidade aumenta para manter a vazão.","recall":"Como pressão e velocidade se relacionam em um tubo horizontal ideal?","tags":["fluidos","Bernoulli","Arquimedes"],"questionIds":["af009","af010"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f04"],"videoIds":["v-fi-bernoulli"]},{"id":"ason-f11","unitId":"ason-phys-fluid","order":2,"title":"Propriedades dos fluidos, Pascal e Arquimedes","objective":"Relacionar densidade, viscosidade, tensão superficial, pressão e empuxo.","duration":14,"summary":"Fluidos apresentam propriedades macroscópicas e transmitem pressões. O empuxo é igual ao peso do fluido deslocado.","points":["Massa específica é massa por volume.","Viscosidade mede resistência ao escoamento.","Pascal transmite variações de pressão.","Arquimedes determina o empuxo."],"example":"Uma prensa hidráulica amplifica força usando áreas diferentes sob a mesma variação de pressão.","recall":"Quando um corpo flutua em equilíbrio, como se relacionam peso e empuxo?","tags":["Pascal","Arquimedes","viscosidade"],"questionIds":["af021","af022"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f10"],"videoIds":["v-fi-fluid-search","v-fi-bernoulli"]},{"id":"ason-f06","unitId":"ason-phys-thermo","order":1,"title":"Termodinâmica e máquinas térmicas","objective":"Analisar gases ideais, processos e eficiência.","duration":15,"summary":"Termodinâmica estuda temperatura, calor, trabalho e transformações de sistemas macroscópicos.","points":["Lei zero fundamenta temperatura.","Primeira lei relaciona energia interna, calor e trabalho.","PV=nRT para gás ideal.","A segunda lei limita a conversão de calor em trabalho.","Máquinas térmicas operam em ciclos."],"example":"Em expansão isotérmica de gás ideal, a energia interna não varia, pois depende da temperatura.","recall":"Por que nenhuma máquina térmica real tem rendimento de 100%?","tags":["termodinâmica","gases","máquinas térmicas"],"questionIds":["af011","af012"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f05"],"videoIds":["v-fi-thermo-search","v-fi-machines"]},{"id":"ason-f12","unitId":"ason-phys-thermo","order":2,"title":"Calorimetria e condução de calor","objective":"Calcular trocas de calor e interpretar fluxo térmico.","duration":13,"summary":"Calor é energia transferida por diferença de temperatura. Calor específico relaciona energia, massa e variação térmica; condução depende do gradiente e do material.","points":["Q=mcΔT sem mudança de fase.","Calor latente atua em mudança de fase.","Condução ocorre por interação microscópica.","Isolantes reduzem fluxo térmico."],"example":"Aquecer 2 kg de água em 5 °C requer Q=2·c·5.","recall":"Por que uma parede mais espessa tende a reduzir a taxa de condução?","tags":["calorimetria","condução"],"questionIds":["af023","af024"],"difficulty":"Intermediário","video":null,"discipline":"Física","prerequisites":["ason-f11"],"videoIds":["v-fi-heat"]},{"id":"ason-f13","unitId":"ason-phys-thermo","order":3,"title":"Segunda lei, máquinas e refrigeradores","objective":"Analisar limites de eficiência e fluxos de energia.","duration":14,"summary":"A segunda lei estabelece direção e limita conversão de calor em trabalho. Máquinas retiram calor da fonte quente; refrigeradores usam trabalho para retirar calor da fonte fria.","points":["Nenhuma máquina cíclica converte todo calor em trabalho.","Rendimento η=W/Qh.","Refrigerador possui coeficiente de desempenho.","Carnot estabelece limite ideal entre temperaturas."],"example":"Uma máquina que recebe 1000 J e realiza 300 J tem rendimento de 30%.","recall":"Por que um refrigerador precisa receber trabalho externo?","tags":["segunda lei","máquinas térmicas"],"questionIds":["af025","af026"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f12"],"videoIds":["v-fi-machines","v-fi-thermo-search"]},{"id":"ason-f07","unitId":"ason-phys-elec","order":1,"title":"Eletrostática e circuitos DC","objective":"Relacionar cargas, campo, potencial e corrente contínua.","duration":15,"summary":"Eletrostática descreve interações entre cargas; circuitos DC tratam corrente, resistência e capacitores.","points":["Lei de Coulomb depende do inverso do quadrado da distância.","Campo é força por unidade de carga.","Potencial é energia por unidade de carga.","Lei de Ohm: V=RI.","Kirchhoff conserva carga e energia nos circuitos."],"example":"Dois resistores em série possuem a mesma corrente e resistências somadas.","recall":"Qual é a diferença entre campo elétrico e potencial?","tags":["eletrostática","DC","Kirchhoff"],"questionIds":["af013","af014"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f06"],"videoIds":["v-fi-coulomb","v-fi-rc"]},{"id":"ason-f14","unitId":"ason-phys-elec","order":2,"title":"Distribuições de carga e superfícies equipotenciais","objective":"Calcular campos e potenciais de fontes discretas e contínuas.","duration":15,"summary":"O princípio de superposição soma contribuições. Distribuições contínuas exigem integração. Superfícies equipotenciais são perpendiculares ao campo elétrico.","points":["Campo é vetorial.","Potencial é escalar.","E aponta para diminuição do potencial.","Não há trabalho ao mover carga sobre equipotencial."],"example":"Em simetria esférica, o campo externo pode se comportar como o de uma carga puntiforme total.","recall":"Qual é o ângulo entre linhas de campo e uma superfície equipotencial?","tags":["campo elétrico","equipotencial"],"questionIds":["af027","af028"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f13"],"videoIds":["v-fi-coulomb"]},{"id":"ason-f15","unitId":"ason-phys-elec","order":3,"title":"Capacitância, associações, energia e dielétricos","objective":"Analisar capacitores planos, cilíndricos, esféricos e seus arranjos.","duration":15,"summary":"Capacitância mede carga armazenada por tensão. A geometria e o dielétrico determinam C; associações em série e paralelo obedecem regras distintas.","points":["C=Q/V.","Paralelo soma capacitâncias.","Série soma inversos.","Energia armazenada é CV²/2.","Dielétrico aumenta capacitância."],"example":"Dois capacitores em paralelo ficam submetidos à mesma tensão.","recall":"O que acontece com a capacitância de placas paralelas quando a distância diminui?","tags":["capacitância","dielétricos"],"questionIds":["af029","af030"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f14"],"videoIds":["v-fi-coulomb"]},{"id":"ason-f16","unitId":"ason-phys-elec","order":4,"title":"Leis de Kirchhoff e circuitos RC","objective":"Resolver redes de corrente contínua e transientes de carga.","duration":15,"summary":"Kirchhoff expressa conservação de carga nos nós e de energia nas malhas. Em circuitos RC, carga e corrente variam exponencialmente.","points":["Soma das correntes no nó é zero.","Soma algébrica das tensões em malha é zero.","Constante de tempo é τ=RC.","Após várias constantes de tempo, o capacitor se aproxima do regime final."],"example":"Na carga, Vc(t)=E(1−e^(−t/RC)).","recall":"Qual é o significado físico da constante de tempo RC?","tags":["Kirchhoff","circuito RC"],"questionIds":["af031","af032"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f15"],"videoIds":["v-fi-rc"]},{"id":"ason-f08","unitId":"ason-phys-mag","order":1,"title":"Magnetismo, indução e circuitos AC","objective":"Compreender forças magnéticas, Faraday–Lenz e potência em AC.","duration":16,"summary":"O eletromagnetismo conecta correntes, campos magnéticos, indução e sistemas de corrente alternada.","points":["Biot–Savart e Ampère calculam campos.","Faraday relaciona variação de fluxo à fem induzida.","Lenz define o sentido que se opõe à variação.","Indutores armazenam energia magnética.","Em AC, valor eficaz e fator de potência são fundamentais."],"example":"Um transformador ideal altera tensão e corrente por indução, mantendo aproximadamente a potência.","recall":"O que determina o sentido da corrente induzida?","tags":["magnetismo","indução","AC"],"questionIds":["af015","af016"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f07"],"videoIds":["v-fi-faraday","v-fi-ac-search"]},{"id":"ason-f17","unitId":"ason-phys-mag","order":2,"title":"Biot–Savart e Lei de Ampère","objective":"Determinar campos magnéticos produzidos por correntes.","duration":15,"summary":"Biot–Savart soma contribuições elementares de corrente. Ampère simplifica cálculos quando há simetria suficiente.","points":["Correntes geram campo magnético.","A direção segue regra da mão direita.","Ampère relaciona circulação de B à corrente envolvida.","Simetria cilíndrica favorece Ampère."],"example":"Ao redor de um fio retilíneo longo, B é tangente a círculos centrados no fio.","recall":"Quando a Lei de Ampère é especialmente útil?","tags":["Biot-Savart","Ampère"],"questionIds":["af033","af034"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f16"],"videoIds":["v-fi-mag-search"]},{"id":"ason-f18","unitId":"ason-phys-mag","order":3,"title":"Geradores, motores e indutância","objective":"Relacionar força magnética, conversão eletromecânica e armazenamento de energia.","duration":15,"summary":"Motores convertem energia elétrica em mecânica; geradores fazem o inverso. Indutores se opõem a variações de corrente e armazenam energia magnética.","points":["Força em fio é I L×B.","Faraday fundamenta geradores.","Fem autoinduzida é −L di/dt.","Energia do indutor é LI²/2.","Indutância mútua acopla circuitos."],"example":"Um transformador opera por indução mútua entre enrolamentos.","recall":"Por que um indutor se opõe a uma mudança rápida de corrente?","tags":["motores","geradores","indutância"],"questionIds":["af035","af036"],"difficulty":"Avançado","video":null,"discipline":"Física","prerequisites":["ason-f17"],"videoIds":["v-fi-faraday"]},{"id":"ason-f19","unitId":"ason-phys-mag","order":4,"title":"Circuitos AC, potência, filtros e transformadores","objective":"Interpretar valores eficazes, fase, seletividade e transformação de tensão.","duration":16,"summary":"Em AC, tensão e corrente variam no tempo e podem estar defasadas. Filtros selecionam faixas de frequência; transformadores alteram níveis  function addSpecs(course, unit, prefix, orderBase, specs, defaultDiscipline){

 const dpModules=[{"unit":{"id":"dp-gen-pt","title":"Conhecimentos Gerais — Língua Portuguesa","description":"Interpretação, coesão, morfossintaxe, norma-padrão e reescrita no estilo FGV.","color":"teal","discipline":"Português"},"prefix":"dpt","order":78,"lessons":[{"title":"Interpretação, tema e inferência","objective":"Separar informação explícita, inferência válida e extrapolação.","summary":"A resposta deve decorrer do texto. Inferir é concluir a partir de pistas; extrapolar é acrescentar informação que o texto não autoriza.","points":["Tema é o recorte central do texto.","Tese é a posição defendida em textos argumentativos.","Inferências precisam de evidência textual.","Termos absolutos podem distorcer afirmações graduais."],"example":"Se o texto afirma que uma medida reduz riscos, não se pode concluir que ela elimina todos os riscos.","recall":"Explique a diferença entre inferência e extrapolação.","tags":["interpretação","inferência","FGV"],"q":"Em uma questão de interpretação, uma inferência válida é aquela que:","correct":"decorre de pistas e relações presentes no texto","distractors":["repete obrigatoriamente uma frase de forma literal","depende apenas da opinião do candidato","introduz fatos externos não mencionados","contradiz a tese do autor"],"practice":"Localizar no texto as expressões que sustentam a conclusão antes de marcar a alternativa.","difficulty":"Básico","videos":["v-pt-interpretacao"],"prereq":[]},{"title":"Tipos, gêneros e finalidade","objective":"Reconhecer organização textual e objetivo comunicativo.","summary":"Tipos textuais são modos de organização, como narração, descrição, exposição e argumentação; gêneros são formas sociais concretas, como notícia, relatório e artigo.","points":["Um gênero pode combinar diferentes tipos.","A finalidade ajuda a identificar o gênero.","Argumentação defende uma posição.","Exposição organiza informações e explicações."],"example":"Um relatório técnico é gênero textual e pode combinar exposição, descrição e recomendação argumentativa.","recall":"Dê um exemplo de gênero predominantemente expositivo.","tags":["gêneros","tipologia"],"q":"A relação correta entre gênero e tipo textual é:","correct":"um gênero pode combinar mais de um tipo textual","distractors":["cada gênero possui sempre um único tipo","gênero e tipo são expressões sinônimas","tipos textuais são definidos somente pelo suporte","notícia é um tipo textual e narração é um gênero"],"practice":"Identificar primeiro a finalidade e a situação de circulação do texto.","difficulty":"Básico","videos":["v-pt-generos"],"prereq":["dpt-001"]},{"title":"Coesão, referenciação e conectores","objective":"Analisar retomadas, substituições e relações lógico-semânticas.","summary":"A coesão conecta partes do texto por pronomes, elipses, repetições controladas e conectores. O valor do conector deve ser interpretado no contexto.","points":["Pronomes podem retomar ou antecipar referentes.","Conectores expressam causa, oposição, conclusão e condição.","Substituições devem preservar sentido e coesão.","A coerência é o sentido global construído."],"example":"Em “o sistema falhou; por isso, o serviço parou”, “por isso” introduz consequência.","recall":"Cite um conector de concessão e um de conclusão.","tags":["coesão","referenciação","conectores"],"q":"No período “Embora o controle exista, o risco permanece”, a conjunção introduz ideia de:","correct":"concessão","distractors":["causa","conclusão","finalidade","explicação"],"practice":"Substituir um conector somente depois de confirmar que a nova relação lógica é equivalente.","difficulty":"Intermediário","videos":["v-pt-coesao"],"prereq":["dpt-002"]},{"title":"Morfossintaxe, coordenação e subordinação","objective":"Reconhecer classes, funções sintáticas e relações entre orações.","summary":"A análise morfossintática combina classe da palavra, função no período e relação semântica entre orações coordenadas ou subordinadas.","points":["Classes variam de função conforme o contexto

units.push(...[{"id":"dp-sec-found","title":"Segurança — Fundamentos e SGSI","description":"Princípios, políticas, processos, ISO/IEC 27001:2022 e controles da ISO/IEC 27002:2022.","color":"teal","discipline":"Segurança da Informação"},{"id":"dp-sec-risk","title":"Segurança — Riscos e Continuidade","description":"ISO 27005, ISO 31000, tratamento de riscos, BIA e continuidade de negócios.","color":"amber","discipline":"Segurança da Informação"},{"id":"dp-sec-crypto","title":"Segurança — Criptografia e Certificação","description":"Criptografia simétrica e assimétrica, hashes, assinaturas, certificados e protocolos.","color":"violet","discipline":"Segurança da Informação"},{"id":"dp-sec-threat","title":"Segurança — Vulnerabilidades e Proteções","description":"Gestão de vulnerabilidades, malware, hardening e proteção de ativos e ambientes.","color":"rose","discipline":"Segurança da Informação"},{"id":"dp-sec-ops","title":"Segurança — SOC e Operações","description":"IDS, IPS, SIEM, EDR, XDR, DLP, CASB, WAF, SOAR, UEBA e BAS.","color":"blue","discipline":"Segurança da Informação"},{"id":"dp-sec-ir","title":"Segurança — Incidentes e Inteligência","description":"Resposta a incidentes, evidências, threat intelligence, hunting e MITRE ATT&CK.","color":"green","discipline":"Segurança da Informação"},{"id":"dp-sec-app","title":"Segurança — AppSec e Testes","description":"SDL, OWASP, SAST, DAST, IAST, pentest e modelagem de ameaças.","color":"cyan","discipline":"Segurança da Informação"},{"id":"dp-sec-idp","title":"Segurança — IAM, Privacidade e Novas Tecnologias","description":"Identidades, LGPD/GDPR, anonimização, containers, IoT, blockchain e Microsoft 365 E5.","color":"violet","discipline":"Segurança da Informação"}]);
lessons.push(...[{"id":"sec-001","unitId":"dp-sec-found","order":41,"title":"Objetivos e propriedades da segurança","objective":"Distinguir confidencialidade, integridade, disponibilidade e propriedades complementares.","duration":10,"summary":"A segurança da informação protege dados e serviços contra acesso, alteração, destruição e indisponibilidade indevidos, considerando o contexto e os riscos do negócio.","points":["Confidencialidade limita a divulgação a entidades autorizadas.","Integridade protege exatidão, completude e alteração autorizada.","Disponibilidade assegura acesso quando necessário.","Autenticidade, responsabilização e não repúdio complementam a tríade clássica."],"example":"Um ataque que altera silenciosamente valores em uma base compromete principalmente a integridade; um DDoS afeta a disponibilidade.","recall":"Associe um exemplo real a cada elemento da tríade CIA.","tags":["CIA","fundamentos","propriedades"],"questionIds":["q073","q074"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":[],"videoIds":["v-dp-iso"]},{"id":"sec-002","unitId":"dp-sec-found","order":42,"title":"Políticas, normas e procedimentos","objective":"Diferenciar documentos de governança e reconhecer sua hierarquia.","duration":11,"summary":"Políticas expressam diretrizes e responsabilidades; normas detalham requisitos obrigatórios; procedimentos descrevem como executar atividades; orientações ajudam na aplicação.","points":["A política deve ser aprovada pela direção e comunicada.","Normas tornam requisitos mais específicos.","Procedimentos descrevem passos, papéis e evidências.","Documentos precisam de revisão, versionamento e tratamento de exceções."],"example":"A política determina que acessos sejam revistos; o procedimento informa quem extrai a lista, quem aprova e como registrar a evidência.","recall":"Explique por que uma política não substitui um procedimento operacional.","tags":["políticas","procedimentos","governança"],"questionIds":["q075","q076"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-001"],"videoIds":["v-dp-iso"]},{"id":"sec-003","unitId":"dp-sec-found","order":43,"title":"SGSI e ISO/IEC 27001:2022","objective":"Compreender o sistema de gestão e a lógica de melhoria contínua.","duration":13,"summary":"Um Sistema de Gestão de Segurança da Informação integra contexto, liderança, planejamento, suporte, operação, avaliação e melhoria para administrar riscos de forma sistemática.","points":["O escopo define limites e interfaces do SGSI.","Riscos orientam a seleção e o tratamento de controles.","Objetivos precisam ser acompanhados por métricas e evidências.","Auditorias, análise crítica e ações corretivas sustentam melhoria contínua."],"example":"Uma organização define o escopo do SGSI, avalia riscos, escolhe controles, mede resultados e corrige não conformidades.","recall":"Liste as etapas que conectam risco, controle, medição e melhoria.","tags":["ISO 27001","SGSI","melhoria contínua"],"questionIds":["q077","q078"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-002"],"videoIds":["v-dp-iso"]},{"id":"sec-004","unitId":"dp-sec-found","order":44,"title":"ISO/IEC 27002:2022 e controles","objective":"Entender o papel dos controles e sua organização temática.","duration":12,"summary":"A ISO/IEC 27002 oferece orientações para controles de segurança, organizados em temas organizacionais, de pessoas, físicos e tecnológicos.","points":["Controle é uma medida que modifica o risco.","A aplicabilidade depende do contexto e da avaliação de riscos.","Controles podem ser preventivos, detectivos ou corretivos.","A Declaração de Aplicabilidade registra decisões sobre controles no SGSI."],"example":"Um controle de MFA é tecnológico e preventivo; monitoramento de logs é detectivo; restauração de backup é corretiva.","recall":"Classifique três controles como preventivos, detectivos ou corretivos.","tags":["ISO 27002","controles","SoA"],"questionIds":["q079","q080"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-003"],"videoIds":["v-dp-iso"]},{"id":"sec-005","unitId":"dp-sec-risk","order":45,"title":"Ameaça, vulnerabilidade, impacto e risco","objective":"Relacionar os elementos de um cenário de risco.","duration":10,"summary":"Risco surge quando ameaças podem explorar vulnerabilidades e provocar consequências sobre ativos e objetivos.","points":["Ativo é algo com valor para a organização.","Ameaça é uma causa potencial de incidente.","Vulnerabilidade é uma fraqueza explorável.","Impacto e probabilidade apoiam a estimativa do nível de risco."],"example":"Um serviço exposto e sem correção possui uma vulnerabilidade; um atacante é a ameaça; indisponibilidade e vazamento são impactos possíveis.","recall":"Construa um cenário contendo ativo, ameaça, vulnerabilidade e impacto.","tags":["risco","ameaça","vulnerabilidade"],"questionIds":["q081","q082"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-004"],"videoIds":["v-dp-risk"]},{"id":"sec-006","unitId":"dp-sec-risk","order":46,"title":"Processo de gestão de riscos","objective":"Ordenar identificação, análise, avaliação, tratamento e monitoramento.","duration":12,"summary":"A gestão de riscos estabelece contexto, identifica cenários, analisa probabilidade e impacto, compara resultados com critérios, trata e monitora mudanças.","points":["Critérios devem ser definidos antes da avaliação.","A análise estima natureza e nível do risco.","A avaliação prioriza riscos com base em critérios.","Comunicação, consulta, monitoramento e análise crítica atravessam o processo."],"example":"Após estimar um risco como alto, a organização compara com o apetite definido e decide o tratamento adequado.","recall":"Qual é a diferença entre análise e avaliação de riscos?","tags":["ISO 27005","ISO 31000","processo de risco"],"questionIds":["q083","q084"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-005"],"videoIds":["v-dp-risk"]},{"id":"sec-007","unitId":"dp-sec-risk","order":47,"title":"Tratamento, risco residual e aceitação","objective":"Escolher respostas ao risco e reconhecer risco residual.","duration":11,"summary":"Riscos podem ser modificados com controles, evitados, compartilhados ou retidos; após o tratamento permanece um risco residual que precisa de decisão consciente.","points":["Tratamento deve ter responsáveis, prazo e recursos.","Controles podem reduzir probabilidade, impacto ou ambos.","Transferência não elimina toda responsabilidade.","Aceitação deve respeitar autoridade e critérios definidos."],"example":"Uma empresa contrata seguro cibernético, mas ainda mantém responsabilidades de prevenção e resposta.","recall":"Explique por que transferir risco não significa eliminá-lo.","tags":["tratamento","risco residual","aceitação"],"questionIds":["q085","q086"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-006"],"videoIds":["v-dp-risk"]},{"id":"sec-008","unitId":"dp-sec-risk","order":48,"title":"BIA, continuidade e recuperação","objective":"Relacionar análise de impacto, estratégias e planos de continuidade.","duration":14,"summary":"A continuidade de negócios identifica processos prioritários, impactos da interrupção e recursos necessários para manter ou recuperar operações em níveis aceitáveis.","points":["BIA identifica processos críticos e impactos ao longo do tempo.","RTO representa o tempo-alvo para restauração.","RPO representa a perda de dados tolerável medida no tempo.","Planos precisam de testes, exercícios e atualização."],"example":"Se o RPO é 15 minutos, a estratégia de proteção precisa limitar a perda potencial de dados a aproximadamente esse intervalo.","recall":"Diferencie RTO e RPO em uma frase para cada um.","tags":["continuidade","BIA","RTO","RPO"],"questionIds":["q087","q088"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-007"],"videoIds":["v-dp-bcp"]},{"id":"sec-009","unitId":"dp-sec-crypto","order":49,"title":"Conceitos e objetivos da criptografia","objective":"Distinguir cifragem, codificação, hash e gestão de chaves.","duration":11,"summary":"Criptografia aplica transformações matemáticas para proteger confidencialidade, integridade, autenticidade e não repúdio, dependendo do mecanismo e da gestão de chaves.","points":["Cifrar usa chave e algoritmo para produzir texto cifrado.","Codificação não é mecanismo de confidencialidade.","Hash é unidirecional e não usa chave em sua forma simples.","Segurança depende também de geração, armazenamento, rotação e descarte de chaves."],"example":"Base64 pode representar bytes, mas não impede leitura por quem conhece o formato; portanto não substitui criptografia.","recall":"Explique por que codificação Base64 não protege confidencialidade.","tags":["criptografia","hash","chaves"],"questionIds":["q089","q090"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-008"],"videoIds":["v-dp-crypto"]},{"id":"sec-010","unitId":"dp-sec-crypto","order":50,"title":"Criptografia simétrica, AES, DES e modos","objective":"Comparar cifras simétricas e compreender modos de operação.","duration":13,"summary":"Criptografia simétrica usa a mesma chave secreta para cifrar e decifrar, oferecendo bom desempenho, mas exigindo distribuição e proteção adequada da chave.","points":["AES é uma cifra de bloco moderna amplamente utilizada.","DES possui chave efetiva curta e é inadequado para proteção atual.","Modos de operação definem como blocos são processados.","IVs e nonces devem seguir os requisitos do modo adotado."],"example":"Em GCM, reutilizar nonce com a mesma chave pode comprometer confidencialidade e integridade.","recall":"Por que a gestão de nonce é importante em modos autenticados?","tags":["AES","DES","modos de operação"],"questionIds":["q091","q092"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-009"],"videoIds":["v-dp-crypto"]},{"id":"sec-011","unitId":"dp-sec-crypto","order":51,"title":"Criptografia assimétrica e RSA","objective":"Entender pares de chaves, confidencialidade e assinatura.","duration":13,"summary":"Criptografia assimétrica utiliza chave pública e privada relacionadas matematicamente, facilitando distribuição de chaves e assinaturas, porém com maior custo computacional.","points":["Chave pública pode ser distribuída.","Chave privada deve permanecer protegida.","RSA pode apoiar cifragem de pequenos dados e assinaturas conforme o esquema.","Sistemas híbridos combinam assimetria para acordo/proteção de chave e simetria para dados."],"example":"No TLS, mecanismos assimétricos podem autenticar e estabelecer segredos, enquanto cifras simétricas protegem o fluxo da sessão.","recall":"Explique por que sistemas reais costumam combinar criptografia simétrica e assimétrica.","tags":["RSA","chave pública","criptografia híbrida"],"questionIds":["q093","q094"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-010"],"videoIds":["v-dp-crypto","v-dp-rsa"]},{"id":"sec-012","unitId":"dp-sec-crypto","order":52,"title":"Hash, MAC e armazenamento de senhas","objective":"Diferenciar hash simples, autenticação de mensagem e derivação de senha.","duration":12,"summary":"Hashes verificam integridade; MACs usam chave secreta para autenticar mensagem; senhas devem ser armazenadas com funções de derivação lentas, salt único e parâmetros adequados.","points":["MD5 e SHA-1 não são indicados para resistência moderna a colisões.","HMAC combina uma função hash com chave secreta.","Salt reduz o reaproveitamento de tabelas pré-computadas.","Funções de senha devem ser intencionalmente custosas."],"example":"Duas pessoas com a mesma senha devem ter hashes armazenados diferentes quando salts aleatórios são usados.","recall":"Diferencie hash, HMAC e função de derivação de senha.","tags":["hash","HMAC","senhas"],"questionIds":["q095","q096"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-011"],"videoIds":["v-dp-crypto"]},{"id":"sec-013","unitId":"dp-sec-crypto","order":53,"title":"Assinatura digital e não repúdio","objective":"Compreender geração, verificação e propriedades de assinaturas.","duration":12,"summary":"Assinatura digital normalmente aplica a chave privada do signatário sobre um resumo ou estrutura assinada; a chave pública permite verificar integridade e autenticidade.","points":["Assinar não implica cifrar o conteúdo.","Alterações no documento invalidam a verificação.","A proteção da chave privada é essencial.","Não repúdio depende de controles técnicos, processuais e jurídicos."],"example":"Um documento pode ser público e ainda assim assinado para permitir que terceiros verifiquem autoria e integridade.","recall":"Por que assinatura digital não é sinônimo de confidencialidade?","tags":["assinatura digital","integridade","não repúdio"],"questionIds":["q097","q098"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-012"],"videoIds":["v-dp-rsa"]},{"id":"sec-014","unitId":"dp-sec-crypto","order":54,"title":"Certificados digitais, PKI e revogação","objective":"Relacionar identidade, chave pública, confiança e estado do certificado.","duration":14,"summary":"Certificados vinculam uma identidade a uma chave pública por meio da assinatura de uma autoridade certificadora, dentro de uma cadeia de confiança.","points":["X.509 é um formato comum de certificado.","A cadeia liga certificado final a intermediárias e raiz confiável.","CRL e OCSP apoiam verificação de revogação.","Tokens e smartcards podem proteger chaves privadas e operações."],"example":"Um navegador valida nome, período, cadeia, assinatura e estado de revogação antes de confiar no certificado do servidor.","recall":"Quais verificações devem ser feitas antes de confiar em um certificado?","tags":["certificação digital","PKI","X.509"],"questionIds":["q099","q100"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-013"],"videoIds":["v-dp-rsa"]},{"id":"sec-015","unitId":"dp-sec-threat","order":55,"title":"Ciclo de gestão de vulnerabilidades","objective":"Compreender inventário, descoberta, priorização, correção e validação.","duration":13,"summary":"Gestão de vulnerabilidades é um processo contínuo que combina visibilidade de ativos, identificação de fraquezas, priorização por risco, remediação e verificação.","points":["Scanner identifica sinais e versões, mas pode gerar falsos positivos.","CVSS ajuda a descrever severidade, não substitui contexto de negócio.","Exposição, explorabilidade e criticidade alteram prioridade.","A correção precisa ser validada e acompanhada por métricas."],"example":"Uma CVE crítica em ativo isolado pode ter prioridade menor que uma falha explorada ativamente em serviço público de alta criticidade.","recall":"Quais fatores, além do CVSS, devem influenciar a prioridade?","tags":["vulnerabilidades","CVE","CVSS","patches"],"questionIds":["q101","q102"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-014"],"videoIds":["v-dp-vuln"]},{"id":"sec-016","unitId":"dp-sec-threat","order":56,"title":"Malware: vírus, worms, ransomware, spyware e rootkits","objective":"Diferenciar comportamento, propagação e impacto de códigos maliciosos.","duration":12,"summary":"Malware é software ou código com finalidade maliciosa; as categorias descrevem métodos de propagação, persistência, espionagem, controle ou extorsão.","points":["Vírus depende de hospedeiro e execução.","Worm pode se propagar automaticamente por redes.","Ransomware cifra ou bloqueia recursos e busca extorsão.","Rootkit busca ocultação e controle privilegiado."],"example":"Um worm explora uma falha remota para se espalhar; ransomware pode ser a carga final instalada após o acesso.","recall":"Compare vírus, worm e ransomware em propagação e objetivo.","tags":["malware","ransomware","rootkit"],"questionIds":["q103","q104"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-015"],"videoIds":["v-dp-ransom"]},{"id":"sec-017","unitId":"dp-sec-threat","order":57,"title":"Hardening de servidores e sistemas operacionais","objective":"Aplicar redução de superfície de ataque e configuração segura.","duration":13,"summary":"Hardening remove ou restringe recursos desnecessários, aplica configurações seguras, reduz privilégios e mantém o sistema monitorado e atualizado.","points":["Serviços e portas não usados devem ser desativados.","Contas padrão e privilégios precisam de revisão.","Baselines permitem padronização e verificação.","Logs, EDR e gestão de patches sustentam a operação segura."],"example":"Um servidor web não deve manter compiladores, contas administrativas genéricas ou serviços de compartilhamento sem necessidade.","recall":"Cite quatro ações de hardening aplicáveis a um servidor recém-instalado.","tags":["hardening","servidores","sistemas operacionais"],"questionIds":["q105","q106"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-016"],"videoIds":["v-dp-hardening"]},{"id":"sec-018","unitId":"dp-sec-threat","order":58,"title":"Proteção física, lógica, redes e nuvem","objective":"Combinar controles em camadas para diferentes ambientes.","duration":14,"summary":"Segurança efetiva combina controles físicos, lógicos, de rede, aplicação e nuvem, evitando depender de uma única barreira.","points":["Controle físico protege instalações e equipamentos.","Firewall e segmentação limitam fluxos.","VPN protege tráfego por redes não confiáveis.","Na nuvem, responsabilidades são compartilhadas entre provedor e cliente conforme o serviço."],"example":"Um datacenter usa controle de acesso físico, câmeras, segmentação, MFA administrativa e criptografia de backups.","recall":"Explique o modelo de responsabilidade compartilhada em IaaS e SaaS.","tags":["defesa em profundidade","VPN","nuvem"],"questionIds":["q107","q108"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-017"],"videoIds":["v-dp-cloudsec"]},{"id":"sec-019","unitId":"dp-sec-ops","order":59,"title":"IDS, IPS e sensores de rede","objective":"Diferenciar detecção, prevenção, posicionamento e limitações.","duration":11,"summary":"IDS monitora e alerta; IPS opera em linha e pode bloquear ou modificar tráfego. Ambos dependem de regras, assinaturas, comportamento e ajustes para reduzir falsos alertas.","points":["NIDS observa tráfego de rede.","HIDS observa eventos no host.","IPS em linha pode afetar disponibilidade se mal configurado.","Criptografia ponta a ponta limita a inspeção sem visibilidade apropriada."],"example":"Um NIDS fora de banda gera alerta; um IPS em linha pode descartar o pacote correspondente.","recall":"Qual é o risco operacional de um IPS com regra excessivamente ampla?","tags":["IDS","IPS","detecção"],"questionIds":["q109","q110"],"difficulty":"Básico","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-018"],"videoIds":["v-dp-soc"]},{"id":"sec-020","unitId":"dp-sec-ops","order":60,"title":"SIEM, logs e correlação","objective":"Compreender coleta, normalização, correlação e investigação de eventos.","duration":13,"summary":"SIEM centraliza registros de múltiplas fontes, normaliza dados, aplica regras ou análises e apoia detecção, investigação, relatórios e retenção.","points":["Qualidade do log influencia a detecção.","Sincronização de tempo é essencial para linha do tempo.","Correlação combina eventos relacionados.","Casos de uso precisam de ajuste, contexto e revisão."],"example":"Uma autenticação impossível pode ser detectada ao correlacionar logins geograficamente incompatíveis em curto intervalo.","recall":"Por que relógios sincronizados são importantes em uma investigação?","tags":["SIEM","logs","correlação"],"questionIds":["q111","q112"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-019"],"videoIds":["v-dp-siem"]},{"id":"sec-021","unitId":"dp-sec-ops","order":61,"title":"EDR e XDR","objective":"Relacionar telemetria, detecção, investigação e resposta.","duration":12,"summary":"EDR concentra visibilidade e resposta em endpoints; XDR correlaciona telemetria de múltiplas camadas, como endpoint, identidade, e-mail, nuvem e rede.","points":["EDR pode isolar host, coletar artefatos e bloquear processos.","XDR amplia correlação entre domínios.","Nenhuma ferramenta dispensa processos e analistas.","Cobertura, integração e qualidade de telemetria determinam valor."],"example":"Um alerta de e-mail malicioso pode ser correlacionado com execução no endpoint e uso anômalo de identidade em uma plataforma XDR.","recall":"Diferencie EDR e XDR pelo escopo da telemetria.","tags":["EDR","XDR","endpoint"],"questionIds":["q113","q114"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-020"],"videoIds":["v-dp-siem"]},{"id":"sec-022","unitId":"dp-sec-ops","order":62,"title":"DLP, CASB e WAF","objective":"Distinguir controles de dados, uso de nuvem e aplicações web.","duration":12,"summary":"DLP identifica e controla movimentação de dados sensíveis; CASB aplica visibilidade e políticas entre usuários e serviços em nuvem; WAF filtra tráfego de aplicações web.","points":["DLP pode inspecionar conteúdo, contexto e destino.","CASB apoia controle de SaaS e shadow IT.","WAF opera na camada de aplicação HTTP.","Controles precisam de classificação de dados e políticas bem definidas."],"example":"Um DLP bloqueia envio de CPF por e-mail; um CASB restringe upload em SaaS não autorizado; um WAF bloqueia padrão de injeção.","recall":"Associe DLP, CASB e WAF a um cenário prático.","tags":["DLP","CASB","WAF"],"questionIds":["q115","q116"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-021"],"videoIds":["v-dp-soc"]},{"id":"sec-023","unitId":"dp-sec-ops","order":63,"title":"SOAR e automação de resposta","objective":"Compreender orquestração, playbooks e governança da automação.","duration":12,"summary":"SOAR integra ferramentas, automatiza tarefas repetitivas e executa playbooks de resposta com decisões, aprovações e registros.","points":["Orquestração conecta sistemas e dados.","Automação executa ações padronizadas.","Playbooks precisam de critérios, tratamento de erros e autorização.","Ações de alto impacto podem exigir aprovação humana."],"example":"Um playbook enriquece um IP, consulta reputação, cria caso e solicita aprovação antes de bloquear no firewall.","recall":"Quais riscos existem em automatizar bloqueios sem validação?","tags":["SOAR","playbook","automação"],"questionIds":["q117","q118"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-022"],"videoIds":["v-dp-siem"]},{"id":"sec-024","unitId":"dp-sec-ops","order":64,"title":"UEBA e Breach and Attack Simulation","objective":"Entender análise comportamental e validação contínua de controles.","duration":12,"summary":"UEBA identifica desvios de comportamento de usuários e entidades; BAS simula técnicas de ataque de forma controlada para avaliar se controles detectam ou bloqueiam ações.","points":["UEBA usa contexto e linhas de base.","Anomalia não é prova automática de ataque.","BAS valida cobertura e gera evidências mensuráveis.","Simulação deve ser autorizada, segura e alinhada a objetivos."],"example":"UEBA sinaliza acesso incomum de uma conta; BAS executa uma técnica controlada para verificar se EDR e SIEM geram os alertas esperados.","recall":"Por que uma anomalia comportamental precisa de investigação contextual?","tags":["UEBA","BAS","validação"],"questionIds":["q119","q120"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-023"],"videoIds":["v-dp-soc"]},{"id":"sec-025","unitId":"dp-sec-ir","order":65,"title":"Ciclo de resposta a incidentes e NIST SP 800-61","objective":"Organizar preparação, detecção, resposta e recuperação, reconhecendo a atualização do NIST.","duration":14,"summary":"Resposta a incidentes precisa estar integrada à gestão de riscos. O edital cita o NIST SP 800-61; a revisão 3, publicada em 2025, alinha recomendações às funções do CSF 2.0 e substitui a revisão 2.","points":["Preparação ocorre antes e durante todo o ciclo.","Detecção e análise determinam escopo e prioridade.","Contenção, erradicação e recuperação limitam impacto e restauram serviços.","Lições aprendidas alimentam melhoria e gestão de riscos."],"example":"Um incidente de ransomware exige coordenação entre detecção, contenção, comunicação, recuperação e melhoria dos controles.","recall":"Explique como as lições aprendidas alteram o risco futuro.","tags":["NIST 800-61","incidentes","CSF"],"questionIds":["q121","q122"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-024"],"videoIds":["v-dp-ir","v-dp-ransom"]},{"id":"sec-026","unitId":"dp-sec-ir","order":66,"title":"Triagem, contenção e preservação de evidências","objective":"Tomar decisões iniciais sem destruir informações relevantes.","duration":13,"summary":"Triagem confirma sinais, classifica severidade e delimita escopo. Contenção reduz dano, mas precisa considerar continuidade e preservação de evidências.","points":["Coleta deve registrar origem, horário, ferramenta e responsável.","Hash pode apoiar verificação de integridade de cópias.","Cadeia de custódia documenta posse e movimentação.","Desligar um equipamento pode eliminar evidência volátil."],"example":"Antes de desligar um host, a equipe avalia risco ativo e necessidade de coletar memória, conexões e processos.","recall":"Quando isolar em vez de desligar imediatamente um equipamento?","tags":["triagem","contenção","evidências"],"questionIds":["q123","q124"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-025"],"videoIds":["v-dp-ir"]},{"id":"sec-027","unitId":"dp-sec-ir","order":67,"title":"Threat intelligence e threat hunting","objective":"Diferenciar inteligência, indicadores, hipóteses e busca proativa.","duration":13,"summary":"Threat intelligence transforma dados sobre ameaças em conhecimento acionável; threat hunting formula hipóteses e procura evidências de atividade não detectada pelos alertas existentes.","points":["IOC é um artefato observável, como hash ou domínio.","TTP descreve comportamento do adversário.","Inteligência precisa de contexto, confiabilidade e relevância.","Hunting gera melhorias de detecção mesmo quando não encontra incidente."],"example":"Uma equipe usa relatório de ameaça para criar hipótese sobre uso de PowerShell e busca eventos compatíveis em endpoints e SIEM.","recall":"Diferencie IOC e TTP e dê um exemplo de cada.","tags":["threat intelligence","threat hunting","IOC","TTP"],"questionIds":["q125","q126"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-026"],"videoIds":["v-dp-mitre"]},{"id":"sec-028","unitId":"dp-sec-ir","order":68,"title":"MITRE ATT&CK, táticas e técnicas","objective":"Usar ATT&CK como linguagem de comportamento adversário e cobertura defensiva.","duration":14,"summary":"MITRE ATT&CK é uma base de conhecimento de comportamentos observados, organizada em táticas, técnicas e sub-técnicas. A versão do catálogo evolui e deve ser registrada nos materiais.","points":["Tática representa o objetivo do adversário.","Técnica descreve como o objetivo pode ser alcançado.","ATT&CK ajuda a mapear detecções, inteligência e exercícios.","Cobertura não deve ser medida apenas pela quantidade de técnicas marcadas."],"example":"Uma regra de detecção pode ser relacionada a uma técnica ATT&CK e testada com procedimento controlado, gerando evidência de cobertura.","recall":"Qual é a diferença entre tática e técnica no ATT&CK?","tags":["MITRE ATT&CK","táticas","técnicas"],"questionIds":["q127","q128"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-027"],"videoIds":["v-dp-mitre"]},{"id":"sec-029","unitId":"dp-sec-app","order":69,"title":"Ciclo de desenvolvimento seguro e DevSecOps","objective":"Integrar segurança desde requisitos até operação.","duration":13,"summary":"Desenvolvimento seguro incorpora requisitos, modelagem, padrões, testes, gestão de dependências, proteção de segredos e monitoramento em todo o ciclo.","points":["Shift left antecipa atividades, mas não elimina controles em produção.","Pipelines precisam de segurança e segregação.","Dependências e cadeia de suprimentos devem ser verificadas.","Falhas precisam de critérios de severidade e tratamento."],"example":"Um pipeline bloqueia dependência vulnerável crítica, executa testes e exige aprovação antes da implantação.","recall":"Por que segurança não deve ser uma etapa única no final do projeto?","tags":["SDL","DevSecOps","pipeline"],"questionIds":["q129","q130"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-028"],"videoIds":["v-dp-owasp"]},{"id":"sec-030","unitId":"dp-sec-app","order":70,"title":"OWASP Top 10 e riscos de aplicações web","objective":"Reconhecer categorias de risco e aplicar prevenção por causa raiz.","duration":14,"summary":"O edital cobra desenvolvimento seguro e aplicações web. O OWASP Top 10 é um documento de conscientização atualizado; a edição 2025 reorganizou categorias e deve ser estudada sem apagar versões anteriores eventualmente usadas pela banca.","points":["Controle de acesso quebrado permanece crítico.","Configuração insegura expõe serviços e dados.","Falhas de cadeia de suprimentos exigem governança de dependências.","Injeção é reduzida por consultas parametrizadas e validação contextual."],"example":"Uma API que confia apenas no identificador enviado pelo cliente pode permitir acesso indevido a registros de outros usuários.","recall":"Escolha uma categoria OWASP e descreva causa, impacto e controle.","tags":["OWASP","aplicações web","Top 10"],"questionIds":["q131","q132"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-029"],"videoIds":["v-dp-owasp"]},{"id":"sec-031","unitId":"dp-sec-app","order":71,"title":"SAST, DAST e IAST","objective":"Diferenciar análise de código, teste em execução e instrumentação.","duration":12,"summary":"SAST analisa código ou artefatos sem executar a aplicação; DAST testa a aplicação em execução externamente; IAST observa a execução com instrumentação interna.","points":["SAST pode atuar cedo e indicar linha de código.","DAST encontra comportamento explorável no ambiente testado.","IAST combina contexto interno e execução.","Resultados precisam de triagem e integração ao processo de correção."],"example":"SAST identifica uma função insegura no código; DAST envia requisições e observa resposta vulnerável; IAST correlaciona a requisição com o fluxo interno.","recall":"Em que fase cada técnica oferece maior valor?","tags":["SAST","DAST","IAST"],"questionIds":["q133","q134"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-030"],"videoIds":["v-dp-owasp"]},{"id":"sec-032","unitId":"dp-sec-app","order":72,"title":"Pentest e modelagem de ameaças STRIDE","objective":"Diferenciar avaliação ofensiva autorizada e análise estruturada de design.","duration":14,"summary":"Pentest simula ataques autorizados em escopo definido para demonstrar impacto; modelagem de ameaças identifica riscos no design antes ou durante o desenvolvimento.","points":["Regras de engajamento definem escopo, horários e limites.","Pentest não substitui gestão contínua de vulnerabilidades.","STRIDE organiza ameaças como spoofing, tampering e elevação de privilégio.","Relatório deve apresentar evidências, risco e recomendações reproduzíveis."],"example":"Antes de testar uma API, a equipe define endpoints, dados permitidos, janela, contatos e procedimento de interrupção.","recall":"Por que autorização e regras de engajamento são essenciais?","tags":["pentest","STRIDE","modelagem de ameaças"],"questionIds":["q135","q136"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-031"],"videoIds":["v-dp-pentest"]},{"id":"sec-033","unitId":"dp-sec-idp","order":73,"title":"IAM, MFA, SSO e acesso privilegiado","objective":"Gerenciar identidades e acessos durante todo o ciclo de vida.","duration":14,"summary":"IAM combina identidade, autenticação, autorização e governança. MFA reduz dependência de um único fator; SSO centraliza autenticação; PAM protege contas e sessões privilegiadas.","points":["Provisionamento deve acompanhar admissão e mudança de função.","Desligamento exige revogação tempestiva.","Menor privilégio e segregação reduzem abuso.","Recertificação verifica se acessos continuam necessários."],"example":"Um colaborador muda de área: acessos antigos são removidos, novos são aprovados e privilégios elevados ficam sob PAM e registro de sessão.","recall":"Descreva o ciclo joiner, mover e leaver.","tags":["IAM","MFA","SSO","PAM"],"questionIds":["q137","q138"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-032"],"videoIds":["v-dp-iam"]},{"id":"sec-034","unitId":"dp-sec-idp","order":74,"title":"LGPD, GDPR e governança de privacidade","objective":"Relacionar princípios, papéis, bases e segurança no tratamento de dados.","duration":14,"summary":"Proteção de dados exige finalidade, necessidade, transparência, segurança e responsabilização, além de papéis, bases legais, direitos e processos para incidentes.","points":["Controlador toma decisões essenciais sobre o tratamento.","Operador trata dados em nome do controlador.","Segurança e prevenção exigem medidas técnicas e administrativas.","GDPR é referência europeia e possui conceitos próximos, mas não idênticos à LGPD."],"example":"Uma organização mapeia finalidades, bases legais, compartilhamentos, retenção, controles e atendimento a titulares.","recall":"Qual é a diferença entre controlador e operador?","tags":["LGPD","GDPR","privacidade"],"questionIds":["q139","q140"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-033"],"videoIds":["v-dp-lgpd"]},{"id":"sec-035","unitId":"dp-sec-idp","order":75,"title":"Anonimização, pseudonimização e reidentificação","objective":"Diferenciar técnicas e avaliar risco de vínculo com o titular.","duration":12,"summary":"Anonimização busca retirar a possibilidade razoável de associação a uma pessoa considerando meios disponíveis; pseudonimização separa identificadores, mas mantém possibilidade controlada de reversão ou vínculo.","points":["Remover nome isoladamente pode ser insuficiente.","Quase-identificadores podem permitir reidentificação.","Pseudônimo continua podendo representar dado pessoal.","Avaliação deve considerar contexto, dados auxiliares e evolução tecnológica."],"example":"Uma base sem nomes ainda pode reidentificar pessoas pela combinação de CEP, data de nascimento e atributos raros.","recall":"Por que retirar CPF não garante anonimização?","tags":["anonimização","pseudonimização","reidentificação"],"questionIds":["q141","q142"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-034"],"videoIds":["v-dp-anon"]},{"id":"sec-036","unitId":"dp-sec-idp","order":76,"title":"Containers, IoT e segurança de novas plataformas","objective":"Reconhecer isolamento, cadeia de imagens, segredos e limitações de dispositivos.","duration":13,"summary":"Containers compartilham o kernel do host e exigem imagens confiáveis, menor privilégio, isolamento e proteção de orquestração. IoT combina restrições de hardware, ciclo longo e grande superfície distribuída.","points":["Imagem deve ser mínima, assinada e verificada.","Segredos não devem estar incorporados à imagem.","Execução privilegiada amplia impacto de escape.","IoT exige identidade de dispositivo, atualização segura e segmentação."],"example":"Um cluster bloqueia imagens sem assinatura, executa como usuário não root e isola dispositivos IoT em segmento próprio.","recall":"Cite três controles para containers e três para IoT.","tags":["containers","Docker","Kubernetes","IoT"],"questionIds":["q143","q144"],"difficulty":"Intermediário","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-035"],"videoIds":["v-dp-containers"]},{"id":"sec-037","unitId":"dp-sec-idp","order":77,"title":"Blockchain e proteção no Microsoft 365 E5","objective":"Compreender conceitos de registro distribuído e controles de proteção da suíte.","duration":13,"summary":"Blockchain usa estruturas encadeadas e consenso para manter registros distribuídos; não garante por si só confidencialidade ou correção dos dados de entrada. Microsoft 365 E5 reúne capacidades de identidade, proteção de informação, conformidade, Defender e investigação.","points":["Imutabilidade prática não significa verdade do dado de origem.","Chaves privadas continuam sendo ponto crítico.","Rótulos e políticas podem classificar e proteger informações.","Defender, Purview e Entra integram sinais e controles em diferentes camadas."],"example":"Um documento recebe rótulo de sensibilidade, proteção de acesso e monitoramento; alertas de identidade e endpoint são correlacionados para investigação.","recall":"Quais propriedades blockchain não oferece automaticamente?","tags":["blockchain","Microsoft 365 E5","Purview","Defender"],"questionIds":["q145","q146"],"difficulty":"Avançado","video":null,"discipline":"Segurança da Informação","prerequisites":["sec-036"],"videoIds":["v-dp-m365"]}]);
